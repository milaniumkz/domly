name: domly
description: Премиальное приложение для регулярной уборки квартир в ЖК Казахстана

publish_to: 'none'

version: 1.0.14+24

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.13.1
  firebase_messaging: ^15.1.3
  shared_preferences: ^2.5.3
  http: ^1.3.0
  http_parser: ^4.1.2
  crypto: ^3.0.6
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.3
  google_maps_flutter: ^2.10.0
  geolocator: ^12.0.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.8.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/logo_pro.png

