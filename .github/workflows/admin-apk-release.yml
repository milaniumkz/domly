name: Build and publish admin APK
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: APK version name
        required: true
        default: '1.0.16'
      version_code:
        description: APK version code
        required: true
        default: '26'
permissions:
  contents: write
concurrency:
  group: admin-apk-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        env:
          APK_VERSION: ${{ inputs.version_name }}
          APK_BUILD: ${{ inputs.version_code }}
        run: |
          [[ "$APK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$APK_BUILD" =~ ^[1-9][0-9]*$ ]]
          printf 'APK_VERSION=%s\nAPK_BUILD=%s\nAPK_TAG=admin-apk-%s-%s-%s\n' "$APK_VERSION" "$APK_BUILD" "$APK_VERSION" "$APK_BUILD" "$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare Android SDK
        run: sdkmanager 'build-tools;35.0.0' 'platforms;android-34' 'platforms;android-35' 'platforms;android-36' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build and verify APK
        env:
          FLUTTER_BIN: flutter
        run: |
          bash scripts/build_android_domly_admin.sh --build-name="$APK_VERSION" --build-number="$APK_BUILD"
          mkdir -p apk-release
          cp build/app/outputs/flutter-apk/app-domlyadmin-release.apk "apk-release/DomLY-Admin-$APK_VERSION-$APK_BUILD.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "apk-release/DomLY-Admin-$APK_VERSION-$APK_BUILD.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "apk-release/DomLY-Admin-$APK_VERSION-$APK_BUILD.apk" > apk-release/badging.txt
          sed -n '1,20p' apk-release/badging.txt
          (cd apk-release && sha256sum "DomLY-Admin-$APK_VERSION-$APK_BUILD.apk" > "DomLY-Admin-$APK_VERSION-$APK_BUILD.apk.sha256")
      - name: Publish approved preliminary admin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$APK_TAG" apk-release/*.apk apk-release/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "DomLY Admin $APK_VERSION ($APK_BUILD) — APK" \
            --notes 'APK админки для ручной установки. Исправлено сохранение настроек допуслуг. Подпись Android Debug; поверх APK с другим ключом не установится. Данные аккаунта хранятся на сервере. Не выпуск для магазинов.'
