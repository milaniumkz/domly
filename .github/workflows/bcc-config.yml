name: Configure BCC sandbox
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Enable public sandbox configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes scripts/server/configure_bcc_test.cjs "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/shared/configure_bcc_test.cjs"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; cd '$DEPLOY_PATH/current'; docker compose -p domly-backend run -T --rm --no-deps --entrypoint node -v '$DEPLOY_PATH:$DEPLOY_PATH' api '$DEPLOY_PATH/shared/configure_bcc_test.cjs' '$DEPLOY_PATH'; docker compose -p domly-backend up -d --no-build --force-recreate api worker; rm -f '$DEPLOY_PATH/shared/configure_bcc_test.cjs'; for attempt in \$(seq 1 30); do if curl -fsS http://localhost:8080/ready >/dev/null; then echo 'Backend ready in BCC sandbox mode'; exit 0; fi; sleep 2; done; exit 1"
