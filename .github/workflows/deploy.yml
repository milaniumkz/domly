name: Deploy backend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment or read-only server inspection
        default: deploy
        type: choice
        options: [deploy, inspect, import-catalog]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON('["milanium-linux-arm64", "repo-domly"]') }}
    timeout-minutes: 30
    environment: production
    steps:
      - name: Inspect web server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" '
            command -v caddy || true
            systemctl is-active caddy || true
            docker ps --format "{{.Names}} {{.Ports}}"
            if test -f /etc/caddy/Caddyfile; then
              awk "/domly\\.kz|^[[:space:]]*(root|reverse_proxy|file_server|handle|handle_path|import|redir)/" /etc/caddy/Caddyfile
            fi
          '
  import-catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'import-catalog' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON('["milanium-linux-arm64", "repo-domly"]') }}
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Back up database and import catalogue once
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH/current' && APP_DIR='$DEPLOY_PATH' bash scripts/server/import_catalog.sh"
  test:
    if: inputs.mode != 'inspect' && inputs.mode != 'import-catalog'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON('["milanium-linux-arm64", "repo-domly"]') }}
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: domly-web
          path: frontend/releases/current
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Prepare release directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases/${GITHUB_SHA}'"
      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'backend/.env' \
            --exclude 'backend/node_modules' \
            --exclude 'backend/dist' \
            --exclude 'backend/backups' \
            --exclude 'backend/storage' \
            --exclude 'build' \
            --exclude '.dart_tool' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/releases/${GITHUB_SHA}/"
      - name: Deploy checked commit
        env:
          OTP_FAILURE_FALLBACK_UNTIL: "2026-10-07T07:50:00Z"
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH/releases/${GITHUB_SHA}' && GITHUB_SHA='${GITHUB_SHA}' APP_DIR='$DEPLOY_PATH' OTP_FAILURE_FALLBACK_UNTIL='$OTP_FAILURE_FALLBACK_UNTIL' bash scripts/server/deploy_backend.sh"
      - name: Public smoke
        run: |
          curl -fsS "${{ secrets.API_HEALTH_URL }}"
          for app in customer pro admin; do
            curl -fsS "https://domly.kz/$app/" -o /dev/null
            curl -fsS "https://domly.kz/$app/main.dart.js" -o /dev/null
          done
