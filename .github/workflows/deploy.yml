name: Deploy backend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reuse_web_from_run:
        description: Optional successful deployment run; allowed only when frontend source is unchanged
        type: string
        required: false
      mode:
        description: Deployment or read-only server inspection
        default: deploy
        type: choice
        options: [deploy, inspect, import-catalog]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON('["milanium-linux-arm64", "repo-domly"]') }}
    timeout-minutes: 30
    environment: production
    steps:
      - name: Inspect web server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" '
            command -v caddy || true
            systemctl is-active caddy || true
            docker ps --format "{{.Names}} {{.Ports}}"
            if test -f /etc/caddy/Caddyfile; then
              awk "/domly\\.kz|^[[:space:]]*(root|reverse_proxy|file_server|handle|handle_path|import|redir)/" /etc/caddy/Caddyfile
            fi
          '
  import-catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'import-catalog' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON('["milanium-linux-arm64", "repo-domly"]') }}
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Back up database and import catalogue once
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH/current' && APP_DIR='$DEPLOY_PATH' bash scripts/server/import_catalog.sh"
  test:
    if: inputs.mode != 'inspect' && inputs.mode != 'import-catalog'
    uses: ./.github/workflows/ci.yml
    with:
      backend_only: ${{ inputs.reuse_web_from_run != '' }}

  deploy:
    needs: test
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON('["milanium-linux-arm64", "repo-domly"]') }}
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify reused web build comes from unchanged frontend source
        if: inputs.reuse_web_from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_RUN_ID: ${{ inputs.reuse_web_from_run }}
        run: |
          set -euo pipefail
          [[ "$WEB_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WEB_RUN_ID" > /tmp/web-source-run.json
          WEB_SOURCE_SHA=$(python3 - <<'PYCODE'
          import json
          run = json.load(open('/tmp/web-source-run.json'))
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['head_branch'] == 'main' and run['path'] == '.github/workflows/deploy.yml'
          print(run['head_sha'])
          PYCODE
          )
          [[ "$WEB_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --depth=1 origin "$WEB_SOURCE_SHA"
          git diff --name-only "$WEB_SOURCE_SHA" HEAD > /tmp/web-source-changes.txt
          while IFS= read -r changed; do
            case "$changed" in
              backend/*|docs/*|.github/*|scripts/server/*) ;;
              *) echo "Frontend build cannot be reused after changing $changed" >&2; exit 1 ;;
            esac
          done < /tmp/web-source-changes.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_web_from_run || github.run_id }}
          name: domly-web
          path: frontend/releases/current
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Prepare release directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases/${GITHUB_SHA}'"
      - name: Verify reused files preserve rollback copies and exclude secrets
        if: inputs.reuse_web_from_run != ''
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          mkdir "$fixture/source" "$fixture/previous" "$fixture/next"
          printf retained > "$fixture/source/same"
          cp -p "$fixture/source/same" "$fixture/previous/same"
          printf fixture > "$fixture/source/.env"
          rsync -a --exclude=.env --copy-dest="$fixture/previous" "$fixture/source/" "$fixture/next/"
          test ! -e "$fixture/next/.env"
          test "$(stat -c %i "$fixture/previous/same")" != "$(stat -c %i "$fixture/next/same")"
          printf updated > "$fixture/next/same"
          test "$(cat "$fixture/previous/same")" = retained
      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          copy_options=()
          if ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "test -d '$DEPLOY_PATH/current'"; then
            copy_options+=(--copy-dest="$DEPLOY_PATH/current")
          fi
          rsync -az --delete "${copy_options[@]}" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'backend/.env' \
            --exclude 'backend/node_modules' \
            --exclude 'backend/dist' \
            --exclude 'backend/backups' \
            --exclude 'backend/storage' \
            --exclude 'build' \
            --exclude '.dart_tool' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/releases/${GITHUB_SHA}/"
      - name: Deploy checked commit
        env:
          OTP_SHOW_CODE: "false"
          OTP_FAILURE_FALLBACK: "true"
          PUBLIC_API_URL: "https://domly.kz"
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH/releases/${GITHUB_SHA}' && GITHUB_SHA='${GITHUB_SHA}' APP_DIR='$DEPLOY_PATH' OTP_SHOW_CODE='$OTP_SHOW_CODE' OTP_FAILURE_FALLBACK='$OTP_FAILURE_FALLBACK' PUBLIC_API_URL='$PUBLIC_API_URL' bash scripts/server/deploy_backend.sh"
      - name: Public smoke
        run: |
          curl -fsS "${{ secrets.API_HEALTH_URL }}"
          for app in customer pro admin; do
            curl -fsS "https://domly.kz/$app/" -o /dev/null
            curl -fsS "https://domly.kz/$app/main.dart.js" -o /dev/null
          done
