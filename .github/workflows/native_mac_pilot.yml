name: Native Mac Pilot

on:
  push:
    branches: [codex/mac-ci-pilot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mac-domly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter:
    if: github.repository == 'milaniumkz/domly' && (github.ref == 'refs/heads/codex/mac-ci-pilot' || github.ref == 'refs/heads/main')
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["milanium-mac-arm64", "repo-domly"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      FLUTTER_BIN: ${{ github.event_name != 'pull_request' && '/Users/dmitriyshtrakhov/flutter-sdk/flutter/bin/flutter' || 'flutter' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        if: github.event_name == 'pull_request'
        with:
          flutter-version: '3.44.1'
          cache: true
      - name: Select existing Mac Flutter 3.44.1
        if: github.event_name != 'pull_request'
        run: |
          echo /Users/dmitriyshtrakhov/flutter-sdk/flutter/bin >> "$GITHUB_PATH"
          /Users/dmitriyshtrakhov/flutter-sdk/flutter/bin/flutter --version --machine | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["frameworkVersion"] == "3.44.1" and v["dartSdkVersion"] == "3.12.1"'
      - run: flutter pub get ${{ github.event_name != 'pull_request' && '--enforce-lockfile' || '' }}
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/localization test/models test/services test/app test/utils
      - run: ./scripts/build_web_domly.sh
      - run: ./scripts/build_web_domly_pro.sh
      - run: ./scripts/build_web_admin.sh
      - name: Stage web release
        run: |
          mkdir -p web-release/customer web-release/pro web-release/admin
          cp -a build/web-domly/. web-release/customer/
          cp -a build/web-pro/. web-release/pro/
          cp -a build/web-admin/. web-release/admin/
      - uses: actions/upload-artifact@v4
        with:
          name: domly-web
          path: web-release/
          retention-days: 7
