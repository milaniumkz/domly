name: Update admin password
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: prepare
        options: [prepare, apply]
      encrypted_payload:
        description: RSA-OAEP encrypted account and password hash; never a plaintext password
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  update-password:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Generate one-time encryption key
        if: inputs.mode == 'prepare'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "umask 077; openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out '$DEPLOY_PATH/shared/admin-rotation-key.pem' 2>/dev/null && openssl pkey -in '$DEPLOY_PATH/shared/admin-rotation-key.pem' -pubout"
      - name: Update the existing admin password
        if: inputs.mode == 'apply'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          ENCRYPTED_PAYLOAD: ${{ inputs.encrypted_payload }}
        run: |
          set -euo pipefail
          test -n "$ENCRYPTED_PAYLOAD"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes scripts/server/update_admin_password.cjs "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/shared/update_admin_password.cjs"
          printf '%s' "$ENCRYPTED_PAYLOAD" | \
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; cd '$DEPLOY_PATH/current'; base64 -d | openssl pkeyutl -decrypt -inkey '$DEPLOY_PATH/shared/admin-rotation-key.pem' -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | docker compose -p domly-backend exec -T api node -e \"\$(cat '$DEPLOY_PATH/shared/update_admin_password.cjs')\"; rm -f '$DEPLOY_PATH/shared/admin-rotation-key.pem' '$DEPLOY_PATH/shared/update_admin_password.cjs'"
