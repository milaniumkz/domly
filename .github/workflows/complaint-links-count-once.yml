name: Inspect complaint link counters once
'on':
  push:
    branches:
    - support/greeting-audit-20261126
    paths:
    - .github/workflows/complaint-links-count-once.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
    - name: Read only complaint link counts, no identifiers or customer data
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      run: "set -euo pipefail\numask 077\nmkdir -p ~/.ssh\nprintf '%s' \"${{ secrets.VPS_SSH_PRIVATE_KEY_B64\
        \ }}\" | base64 -d > ~/.ssh/deploy_key\nprintf '%s\\n' \"${{ secrets.VPS_KNOWN_HOSTS\
        \ }}\" > ~/.ssh/known_hosts\nssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes\
        \ \"$VPS_USER@$VPS_HOST\" \"cd '$DEPLOY_PATH/current'; docker compose -p domly-backend\
        \ exec -T api node\" <<'JS'\nconst {Database}=require('/app/dist/infrastructure/db/Database');\n\
        (async()=>{const db=new Database(process.env.DATABASE_URL);try{\n const counts=(await\
        \ db.query('SELECT COUNT(*)::int total,COUNT(*) FILTER(WHERE order_id IS NOT\
        \ NULL)::int linked FROM complaints')).rows;\n const latest=(await db.query('SELECT\
        \ order_id IS NOT NULL AS has_order,EXISTS(SELECT 1 FROM service_orders o\
        \ WHERE o.id=c.order_id) AS has_existing_order FROM complaints c ORDER BY\
        \ c.created_at DESC LIMIT 1')).rows;\n console.log(JSON.stringify({complaintLinkCounts:counts,latest}));\n\
        }finally{await db.close();}})().catch(()=>{console.error('AGGREGATE_AUDIT_FAILED');process.exitCode=1;});\n\
        JS\n"
