name: Dispatch checked calculator package-details deployment once
on:
  push:
    branches: [support/dispatch-calculator-details-20261114]
    paths: [.github/workflows/dispatch-calculator-details-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify checked source, retire obsolete queued runs and dispatch standard deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          repo='milaniumkz/domly'
          expected='45ab8a4e0b1fcf0a03b9739862a4fa7efc46e8b8'
          checked='2ee18226b9506c652df891dc2042aa92f51068c7'
          def api(path, method='GET', body=None):
              args=['gh','api','--method',method,'repos/'+repo+'/'+path]
              if body is not None: args+=['--input','-']
              result=subprocess.run(args,input=json.dumps(body) if body is not None else None,text=True,capture_output=True,check=True)
              return json.loads(result.stdout) if result.stdout.strip() else None
          assert api('git/ref/heads/main')['object']['sha']==expected,'Main advanced; re-review before deploying.'
          run=api('actions/runs/43594427314')
          assert run['head_sha']==checked and run['conclusion']=='success'
          merge=api('commits/'+expected)
          assert merge['commit']['tree']['sha']=='82dab28dcae148f94857b3d640de095ed8dcb828','Merged source changed.'
          assert [p['sha'] for p in merge['parents']]==['e10fa2b55843994c52d3d3e3673e7c991ebe1fd3',checked],'Unexpected merge parents.'
          prior=api('actions/runs/43594258416')
          assert prior['head_sha']=='e10fa2b55843994c52d3d3e3673e7c991ebe1fd3' and prior['conclusion']=='success','Server tariff parent was not successfully deployed.'
          # Standard deployment runs the complete CI on this exact merged main before SSH.
          runs=api('actions/workflows/deploy.yml/runs?branch=main&per_page=30')['workflow_runs']
          for old in runs:
              if old['status'] not in ['queued','pending']: continue
              jobs=api('actions/runs/'+str(old['id'])+'/jobs')['jobs']
              assert not any(j['status']=='in_progress' for j in jobs),'Another deployment is active; do not interrupt it.'
              api('actions/runs/'+str(old['id'])+'/cancel','POST')
              print('Cancelled obsolete queued deployment',old['id'])
          api('actions/workflows/deploy.yml/dispatches','POST',{'ref':'main','inputs':{'mode':'deploy'}})
          print('Requested standard main deployment for',expected)
          PY
