name: Read-only isolated AI lab capacity check
on:
  push:
    branches: [support/local-sales-lab-20261123]
    paths: [.github/workflows/local-sales-lab-status.yml]
permissions:
  contents: read
jobs:
  lab-capacity:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Observe only lab resource counters and public readiness
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/lab-key
          chmod 600 ~/.ssh/lab-key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/lab-key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          free -m
          du -sh /opt/domly-ai-lab/models/whisper-small /opt/domly-ai-lab/models/semantic-faq 2>/dev/null || true
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}' domly-ai-lab || true
          docker inspect --format 'status={{.State.Status}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' domly-ai-lab || true
          curl -fsS --max-time 15 http://127.0.0.1:18090/health || true
          curl -fsS --max-time 10 https://domly.kz/ready >/dev/null
          echo production-readiness-ok
          REMOTE
