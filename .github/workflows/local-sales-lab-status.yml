name: Inspect isolated AI lab installation
on:
  push:
    branches: [support/local-sales-lab-20261123]
    paths: [.github/workflows/local-sales-lab-status.yml]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Read only the new lab status and server capacity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/lab-key
          chmod 600 ~/.ssh/lab-key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/lab-key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'free -m; df -h /opt; docker ps -a --filter ancestor=domly-ai-lab:local --format "{{.Names}} {{.Status}}"; docker image ls --filter reference=domly-ai-lab --format "{{.Repository}} {{.Size}}"; du -sh /opt/domly-ai-lab/models /opt/domly-ai-lab/runtime 2>/dev/null || true; find /opt/domly-ai-lab/models -maxdepth 1 -type f -printf "%f %s bytes\n" 2>/dev/null || true; ps -C curl -C pip -C python -C python3 -C llama-server -C llama-quantize -o comm,etime,pcpu,rss || true; if docker inspect domly-ai-lab >/dev/null 2>&1; then docker inspect --format "status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}" domly-ai-lab; docker logs --tail 12 domly-ai-lab; fi; curl -s --max-time 5 http://127.0.0.1:18090/health || true; curl -fsS --max-time 10 https://domly.kz/ready >/dev/null && echo production-ready'

# Read-only installation progress check 2.
