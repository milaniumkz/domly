name: Connect isolated AI lab web access
on:
  push:
    branches: [support/local-sales-lab-20261123]
    paths: [.github/workflows/local-sales-lab-status.yml]
permissions:
  contents: read
jobs:
  lab-web:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Check internal readiness and connect only the new lab web bridge
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/lab-key
          chmod 600 ~/.ssh/lab-key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/lab-key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          docker exec domly-ai-lab python -c "import urllib.request,json;d=json.load(urllib.request.urlopen(\"http://127.0.0.1:18090/health\",timeout=15));assert d[\"ok\"] and d[\"isolated\"];print(\"internal-lab-ready\")"
          if ! curl -fsS --max-time 5 http://127.0.0.1:18090/health >/dev/null; then
            docker network inspect domly-ai-lab-web >/dev/null 2>&1 || docker network create domly-ai-lab-web >/dev/null
            docker network connect domly-ai-lab-web domly-ai-lab
          fi
          curl -fsS --max-time 15 http://127.0.0.1:18090/health
          docker port domly-ai-lab
          curl -fsS --max-time 10 https://domly.kz/ready >/dev/null
          echo lab-web-bridge-ready-production-healthy
          REMOTE
