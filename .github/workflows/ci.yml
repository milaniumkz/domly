---
name: CI
permissions:
  contents: read
jobs:
  backend:
    needs: backend-unit
    runs-on: ${{ github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && (github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/codex/full-ci-pilot') && fromJSON('["milanium-linux-arm64",
      "repo-domly"]') || fromJSON('["ubuntu-latest"]') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: domly_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d domly_test" --health-interval
          5s --health-timeout 5s --health-retries 10
    env:
      DOMLY_INTEGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/domly_test
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - run: npm ci
    - run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d domly_test -v ON_ERROR_STOP=1
        -f sql/schema.sql
    - uses: actions/download-artifact@v4
      with:
        name: domly-backend-tests
        path: backend/dist
    - name: Mandatory real PostgreSQL integration tests
      run: |
        test -n "$DOMLY_INTEGRATION_DATABASE_URL"
        node --test dist/tests/admin-integration.test.js dist/tests/catalog-migration.test.js dist/tests/mobile-integration.test.js
  backend-unit:
    runs-on: ${{ github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && (github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/codex/full-ci-pilot') && fromJSON('["milanium-mac-arm64",
      "repo-domly"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      DOMLY_INTEGRATION_DATABASE_URL: ''
      DATABASE_URL: postgres://unit:unit@127.0.0.1:9/domly_unit
      REDIS_URL: redis://127.0.0.1:9
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') || (github.ref != 'refs/heads/main'
        && github.ref != 'refs/heads/codex/full-ci-pilot')
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - name: Select installed Node 22
      if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && (github.ref == 'refs/heads/main'
        || github.ref == 'refs/heads/codex/full-ci-pilot')
      run: |
        echo /opt/homebrew/opt/node@22/bin >> "$GITHUB_PATH"
        test "$(/opt/homebrew/opt/node@22/bin/node -p 'process.versions.node.split(".")[0]')" = 22
    - run: npm ci
    - name: Require explicit partition of every backend test file
      run: |
        python3 - <<'PYCODE'
        from pathlib import Path
        expected={'backend-core.test.ts','cleaner-status.test.ts','scheduler.test.ts','admin-integration.test.ts','catalog-migration.test.ts','mobile-integration.test.ts'}
        assert {p.name for p in Path('src/tests').glob('*.test.ts')} == expected, 'Classify any new backend test in the unit or DB gate before CI can pass'
        PYCODE
    - run: npm run build
    - name: Pure unit tests, no DB test skipped to claim success
      run: node --test dist/tests/backend-core.test.js dist/tests/cleaner-status.test.js
        dist/tests/scheduler.test.js
    - uses: actions/upload-artifact@v4
      with:
        name: domly-backend-tests
        path: backend/dist
        if-no-files-found: error
        retention-days: 1
  flutter:
    runs-on: ${{ github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && fromJSON('["milanium-mac-arm64",
      "repo-domly"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      FLUTTER_BIN: "${{ github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && '/Users/dmitriyshtrakhov/flutter-sdk/flutter/bin/flutter'
        || 'flutter' }}"
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@v2
      if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      with:
        flutter-version: 3.44.1
        cache: true
    - name: Select existing Mac Flutter 3.44.1
      if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
      run: |
        echo /Users/dmitriyshtrakhov/flutter-sdk/flutter/bin >> "$GITHUB_PATH"
        /Users/dmitriyshtrakhov/flutter-sdk/flutter/bin/flutter --version --machine | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["frameworkVersion"] == "3.44.1" and v["dartSdkVersion"] == "3.12.1"'
    - run: flutter pub get ${{ github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && '--enforce-lockfile'
        || '' }}
    - run: flutter analyze --no-fatal-infos --no-fatal-warnings
    - run: flutter test test/localization test/models test/services test/app test/utils
    - run: "./scripts/build_web_domly.sh"
    - run: "./scripts/build_web_domly_pro.sh"
    - run: "./scripts/build_web_admin.sh"
    - name: Stage web release
      run: |
        mkdir -p web-release/customer web-release/pro web-release/admin
        cp -a build/web-domly/. web-release/customer/
        cp -a build/web-pro/. web-release/pro/
        cp -a build/web-admin/. web-release/admin/
    - uses: actions/upload-artifact@v4
      with:
        name: domly-web
        path: web-release/
        retention-days: 7
'on':
  workflow_call: 
  pull_request: 
  push:
    branches:
    - main
