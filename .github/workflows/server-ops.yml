name: Server operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: status, logs, restart, redeploy, rollback
        required: true
        default: status
        type: choice
        options: [status, logs, restart, redeploy, rollback]

permissions:
  contents: read
  actions: write

concurrency:
  group: production-ops
  cancel-in-progress: false

jobs:
  operation:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Run operation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          ACTION: ${{ inputs.action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ACTION" = "redeploy" ]; then
            gh workflow run deploy.yml --ref main
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$DEPLOY_PATH' bash '$DEPLOY_PATH/scripts/server/ops.sh' '$ACTION'"
