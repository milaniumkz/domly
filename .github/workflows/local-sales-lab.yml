name: DomLY isolated local AI lab
on:
  push:
    branches: [support/local-sales-lab-20261123]
    paths: [.github/workflows/local-sales-lab.yml]
permissions:
  contents: read
concurrency:
  group: domly-isolated-ai-lab
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Prepare isolated lab payload and SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/lab-key
          chmod 600 ~/.ssh/lab-key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          base64 -d > lab-payload.tar.gz <<'PAYLOAD'
          
          PAYLOAD
          echo '4636b486ebe86cce2a2be36b6bae5fbf1ca018459b52b0261e740680a8e6b679  lab-payload.tar.gz' | sha256sum --check -
      - name: Install separate lab without database or application source changes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lab-key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" 'umask 077; mkdir -p /opt/domly-ai-lab'
          scp -i ~/.ssh/lab-key -o IdentitiesOnly=yes lab-payload.tar.gz "$VPS_USER@$VPS_HOST:/opt/domly-ai-lab/payload.tar.gz"
          ssh -i ~/.ssh/lab-key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "set -euo pipefail; umask 077; mkdir -p /opt/domly-ai-lab/bootstrap; tar -xzf /opt/domly-ai-lab/payload.tar.gz -C /opt/domly-ai-lab/bootstrap; cd /opt/domly-ai-lab/bootstrap; LAB_RELEASE='$GITHUB_SHA' bash install_lab.sh"
          scp -i ~/.ssh/lab-key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST:/opt/domly-ai-lab/access.enc" lab-access.enc
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-ai-lab-access
          path: lab-access.enc
          retention-days: 1
          if-no-files-found: error
