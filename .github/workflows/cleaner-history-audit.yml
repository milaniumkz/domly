name: Encrypted cleaner history diagnosis
on:
  workflow_dispatch:
    inputs:
      report_public_key_b64:
        description: Operator public RSA key (SPKI DER, base64)
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read counts, cleaner history and app versions without modifying data
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          REPORT_PUBLIC_KEY: ${{ inputs.report_public_key_b64 }}
          SSH_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$REPORT_PUBLIC_KEY" =~ ^[A-Za-z0-9+/=]+$ ]]
          test "${#REPORT_PUBLIC_KEY}" -le 12000
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes scripts/server/inspect_cleaner_history_encrypted.cjs "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/shared/inspect_cleaner_history_encrypted.cjs"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "set -eu; cd '$DEPLOY_PATH/current'; docker compose -p domly-backend exec -T -e REPORT_PUBLIC_KEY_B64='$REPORT_PUBLIC_KEY' api node < '$DEPLOY_PATH/shared/inspect_cleaner_history_encrypted.cjs'" > cleaner-history.enc.json
      - uses: actions/upload-artifact@v4
        with:
          name: cleaner-history-encrypted
          path: cleaner-history.enc.json
          retention-days: 1
          if-no-files-found: error
