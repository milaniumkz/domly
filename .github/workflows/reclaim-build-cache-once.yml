name: Reclaim unused Docker build cache once
'on':
  push:
    branches:
    - support/greeting-audit-20261126
    paths:
    - .github/workflows/reclaim-build-cache-once.yml
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
    - name: Inspect aggregate deployment disk usage without opening customer data
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      run: 'set -euo pipefail

        umask 077

        mkdir -p ~/.ssh

        printf ''%s'' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key

        printf ''%s\n'' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

        ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "df -h
        /; du -x -m --max-depth=1 ''$DEPLOY_PATH'' /var/log /var/lib/docker; du -x
        -m --max-depth=1 ''$DEPLOY_PATH/releases'' ''$DEPLOY_PATH/backups''"

        '
