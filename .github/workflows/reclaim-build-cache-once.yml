name: Reclaim unused Docker build cache once
'on':
  push:
    branches:
    - support/greeting-audit-20261126
    paths:
    - .github/workflows/reclaim-build-cache-once.yml
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: 'Owner-approved cleanup: generated old web bundles only; retain current
        and five newest releases'
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      run: 'set -euo pipefail

        umask 077

        mkdir -p ~/.ssh

        printf ''%s'' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key

        printf ''%s\n'' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

        ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "python3
        - ''$DEPLOY_PATH'' ''5db35d96a87d378b65915064a0c8f31d4446b614'' --apply" <
        scripts/server/reclaim_old_web_builds_once.py

        ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" ''df
        -h /''

        '
