name: Reclaim unused Docker build cache once
'on':
  push:
    branches:
    - support/greeting-audit-20261126
    paths:
    - .github/workflows/reclaim-build-cache-once.yml
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
    - name: Inspect disk and reclaim only regenerable unused build cache
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
      run: 'set -euo pipefail

        umask 077

        mkdir -p ~/.ssh

        printf ''%s'' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key

        printf ''%s\n'' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

        ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" ''set
        -e; df -h /; docker system df; docker builder prune --all --force --keep-storage
        2GB; df -h /; docker system df''

        '
