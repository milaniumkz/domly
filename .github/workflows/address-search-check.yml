name: Correct Mangilik El 61 directory entry
on:
  push:
    branches: [support/mangilik-el-address-20261124]
    paths: [.github/workflows/address-search-check.yml]
permissions:
  contents: read
jobs:
  public-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public suggestions only
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,time
          cases=[('Мангилик Ел 61','Астана'),('Мәңгілік Ел 61','Астана'),('Мангилик Ел 61',''),('Мангилик Ель 61','Астана'),('Мангилик Ел','Астана')]
          for search,city in cases:
              params=urllib.parse.urlencode({'search':search,'city':city,'lang':'ru','limit':100})
              start=time.monotonic()
              try:
                  with urllib.request.urlopen('https://domly.kz/api/v1/geo/address-suggestions?'+params,timeout=35) as r:
                      data=json.load(r)
                  value=data.get('data',data)
                  rows=value.get('suggestions',[])
                  print(json.dumps({'query':search,'city':city,'seconds':round(time.monotonic()-start,2),'source':value.get('source'),'total':len(rows),'rows':[{k:row.get(k) for k in ['id','source','label','city','street','house','lat','lng']} for row in rows]},ensure_ascii=False),flush=True)
              except Exception as e:
                  print(json.dumps({'query':search,'city':city,'error':str(e)},ensure_ascii=False),flush=True)
          PY

  directory-correction:
    needs: public-search
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    concurrency:
      group: production-ops
      cancel-in-progress: false
    steps:
      - name: Add verified public house and preserve audit evidence
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" | base64 -d > ~/.ssh/address-key
          chmod 600 ~/.ssh/address-key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          base64 -d > add-address.cjs <<'SCRIPT'
          
          SCRIPT
          node --check add-address.cjs
          scp -i ~/.ssh/address-key -o IdentitiesOnly=yes add-address.cjs "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/shared/mangilik-61-${{ github.run_id }}.cjs"
          ssh -i ~/.ssh/address-key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "set -eu; umask 077; mkdir -p '$DEPLOY_PATH/backups/address-directory'; cd '$DEPLOY_PATH/current'; docker compose -p domly-backend exec -T -e GITHUB_RUN_ID='${{ github.run_id }}' api node < '$DEPLOY_PATH/shared/mangilik-61-${{ github.run_id }}.cjs' > '$DEPLOY_PATH/backups/address-directory/${{ github.run_id }}.json'; cat '$DEPLOY_PATH/backups/address-directory/${{ github.run_id }}.json'; docker compose -p domly-backend exec -T -e GITHUB_RUN_ID='${{ github.run_id }}' api node < '$DEPLOY_PATH/shared/mangilik-61-${{ github.run_id }}.cjs'"
      - name: Verify public Russian and Kazakh search and application health
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json
          ids=set()
          for search in ['Мангилик Ел 61','мангилик ел 61','проспект Мангилик Ел 61','Мәңгілік Ел 61']:
              params=urllib.parse.urlencode({'search':search,'city':'Астана','lang':'ru','limit':100})
              with urllib.request.urlopen('https://domly.kz/api/v1/geo/address-suggestions?'+params,timeout=30) as r:
                  data=json.load(r)['data']
              found=[row for row in data['suggestions'] if str(row.get('house'))=='61' and row.get('connected') is True]
              assert len(found)==1,(search,found)
              ids.add(found[0]['id'])
              print(json.dumps({'query':search,'found':found[0]},ensure_ascii=False))
          assert len(ids)==1,'Different directory entries for the same house'
          for path in ['/ready','/customer/','/pro/','/admin/']:
              with urllib.request.urlopen('https://domly.kz'+path,timeout=15) as r:
                  assert r.status==200
              print(path,'OK')
          PY
