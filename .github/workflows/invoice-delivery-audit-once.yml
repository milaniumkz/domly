name: Recover approved existing invoice delivery once
'on':
  push:
    branches:
    - support/invoice-delivery-audit-20261117
    paths:
    - .github/workflows/invoice-delivery-audit-once.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
    - name: Retry guarded existing invoice once and encrypt result
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      run: "set -euo pipefail\numask 077\nmkdir -p ~/.ssh\nprintf '%s' \"${{ secrets.VPS_SSH_PRIVATE_KEY_B64\
        \ }}\" | base64 -d > ~/.ssh/deploy_key\nprintf '%s\\n' \"${{ secrets.VPS_KNOWN_HOSTS\
        \ }}\" > ~/.ssh/known_hosts\ncat > audit.js <<'AUDIT_JS'\nconst {Database}=require(process.cwd()+'/dist/infrastructure/db/Database');\n\
        const {processMoonOutbox}=require(process.cwd()+'/dist/modules/moonAi');\n\
        (async()=>{\nconst db=new Database(process.env.DATABASE_URL),attempts=[];\n\
        try{\nconst selected=(await db.query(\"SELECT id,payment_id FROM moon_ai_outbox\
        \ WHERE encode(sha256(convert_to(id::text,'UTF8')),'hex')=$1\",['16858f0255928729006eaf88182954381e984e1ab9b56806f1c63f6ea763b0fa'])).rows;if(selected.length!==1)throw\
        \ Error('selection_not_unique');const outboxId=selected[0].id,paymentId=selected[0].payment_id;\n\
        const reset=await db.atomic(async()=>{\n const p=(await db.query('SELECT id,status,paid_at,amount\
        \ FROM payments WHERE id=$1 FOR UPDATE',[paymentId])).rows[0];\n const o=(await\
        \ db.query('SELECT id,state,failure_code,finished_at FROM moon_ai_outbox WHERE\
        \ id=$1 AND payment_id=$2 FOR UPDATE',[outboxId,paymentId])).rows[0];\n if(!p||!o||p.status!=='invoice_requested'||p.paid_at)throw\
        \ Error('payment_guard_failed');\n if(o.state==='sent')return false;\n if(o.state!=='uncertain'||o.failure_code!=='delivery_unknown'||o.finished_at)throw\
        \ Error('outbox_guard_failed');\n await db.query(`UPDATE moon_ai_outbox SET\
        \ state='pending',failure_code=NULL,started_at=NULL,finished_at=NULL,run_after=NOW(),payload=payload\
        \ || jsonb_build_object('operatorRetryApprovedAt',NOW()) WHERE id=$1`,[outboxId]);\n\
        \ await db.query(`INSERT INTO audit_logs(action,entity_type,entity_id,payload)\
        \ VALUES('payment.invoice_delivery_retry','payment',$1,$2)`,[paymentId,{source:'support',reason:'customer_confirmed_no_invoice_and_provider_reported_no_request',outboxId}]);\n\
        \ return true;\n});\nconst send=async(url,init)=>{\n const request=JSON.parse(init.body);const\
        \ attempt={startedAt:new Date().toISOString(),thread:request.thread_id,source:request.source,fromType:request.from_type};attempts.push(attempt);\n\
        \ try{const response=await fetch(url,init);attempt.httpStatus=response.status;\n\
        \ const raw=await response.text();let value;try{value=JSON.parse(raw);}catch{};\n\
        \ attempt.accepted=value?.accepted===true;attempt.externalThreadMatches=value?.external_thread_id===request.thread_id;attempt.providerThread=value?.thread_id??null;\n\
        \ return new Response(raw,{status:response.status,headers:response.headers});\n\
        \ }catch(e){attempt.errorKind=e.name;attempt.causeCode=e.cause?.code??null;throw\
        \ e;}\n finally{attempt.finishedAt=new Date().toISOString();}\n};\nif(reset)await\
        \ processMoonOutbox(db,send,outboxId);\nconst outbox=(await db.query('SELECT\
        \ id,state,failure_code,started_at,finished_at,provider_thread_id FROM moon_ai_outbox\
        \ WHERE id=$1',[outboxId])).rows[0];\nconst payment=(await db.query('SELECT\
        \ id,status,paid_at FROM payments WHERE id=$1',[paymentId])).rows[0];\nconsole.log(JSON.stringify({reset,attempts,outbox,payment}));\n\
        }finally{await db.close();}\n})().catch(e=>{console.error('Guarded invoice\
        \ recovery failed:',e.code||e.name);process.exitCode=1;});\nAUDIT_JS\ncat\
        \ > owner-public.pem <<'OWNER_KEY'\n-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArZFJpaJMHLvZBR0zjr5H\n\
        +UR5CveMm1TB4bx9SjYR9b/Ne8iuYN0SHj8N+lf+bXzOUKGIksUpO4FrVIB+vEc2\nvITgY4ovnkjDYI2s0mcoCEi7N8jcEYzSTQ9q5LDgwJ2maOrbNpU+yVQQhTuGOiC3\n\
        Rz2ob7RGxNtMXlLjzIuMH3Ofrh7GE+xW8axvlXeLSkUXwDZwcQW9ty2cet/bIXtC\nNML8Zf08u1E83oxEhBbuyuIMsWVwjGoibdr4UVx6+yDzjGe4ctlmoXPFJDPdNVK0\n\
        PYEEDWGcuz1FFaYk/WxbTVHGXZihvx2q0xID+iiOQxNAfs+XmddRQ2dH7V4IEKF4\nkzB5DjGZRac67xA4tr2wLhjwdKtyMF+hYchVtXHwlb+trhJqYvf49kQ+Truvjs08\n\
        YMAVNoAjfo4IQeWXk3IRn3pff9S7W99O7gUMlrBID3c3UFnatP6eABS8VDO/bazx\npanBYFOQ9U57lJnF4Z/rpxUtD1rgAe0NNmF2hnmybqc1AgMBAAE=\n\
        -----END PUBLIC KEY-----\nOWNER_KEY\nremote_dir=$(ssh -i ~/.ssh/deploy_key\
        \ -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\" 'mktemp -d /tmp/domly-invoice-audit-XXXXXX')\n\
        [[ \"$remote_dir\" =~ ^/tmp/domly-invoice-audit-[A-Za-z0-9]+$ ]]\ntrap 'ssh\
        \ -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\" \"rm\
        \ -rf -- $remote_dir\" >/dev/null 2>&1 || true' EXIT\nscp -i ~/.ssh/deploy_key\
        \ -o IdentitiesOnly=yes audit.js owner-public.pem \"$VPS_USER@$VPS_HOST:$remote_dir/\"\
        \nssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\" \"\
        cd '$DEPLOY_PATH/current' && umask 077 && docker compose -p domly-backend\
        \ exec -T api node - < '$remote_dir/audit.js' > '$remote_dir/report.json'\
        \ && openssl rand -out '$remote_dir/key.bin' 32 && openssl enc -aes-256-cbc\
        \ -salt -pbkdf2 -in '$remote_dir/report.json' -out '$remote_dir/report.enc'\
        \ -pass file:'$remote_dir/key.bin' && openssl pkeyutl -encrypt -pubin -inkey\
        \ '$remote_dir/owner-public.pem' -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256\
        \ -in '$remote_dir/key.bin' -out '$remote_dir/key.enc'\"\nmkdir -m 700 -p\
        \ encrypted-report\nscp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST:$remote_dir/report.enc\"\
        \ \"$VPS_USER@$VPS_HOST:$remote_dir/key.enc\" encrypted-report/\n"
    - uses: actions/upload-artifact@v4
      with:
        name: invoice-delivery-recovery-encrypted
        path: encrypted-report/
        retention-days: 1
        if-no-files-found: error
