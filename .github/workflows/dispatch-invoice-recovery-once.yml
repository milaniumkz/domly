name: Dispatch requested admin APK build once
'on':
  push:
    branches: [support/deploy-invoice-recovery-20261117]
    paths: [.github/workflows/dispatch-invoice-recovery-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build requested APK from checked main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=milaniumkz/domly
          test "$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)" = 1634de1f977d73bc21545e35417a5f66f94ba356
          test "$(gh api "repos/$repo/actions/runs/44065405876" --jq .conclusion)" = success
          gh api -X POST "repos/$repo/actions/workflows/admin-apk-release.yml/dispatches" --input - <<'JSON'
          {"ref":"main","inputs":{"version_name":"1.0.22","version_code":"32"}}
          JSON
