name: Guarded single recheck of same control invoice after provider balance failure
'on':
  push:
    branches:
    - support/deploy-invoice-recovery-20261117
    paths:
    - .github/workflows/dispatch-invoice-recovery-once.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 7
    steps:
    - name: Retry same authorized test only after proving no prior invoice; encrypt
        result
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      run: "set -euo pipefail\numask 077\nmkdir -p ~/.ssh\nprintf '%s' \"${{ secrets.VPS_SSH_PRIVATE_KEY_B64\
        \ }}\" | base64 -d > ~/.ssh/deploy_key\nprintf '%s\\n' \"${{ secrets.VPS_KNOWN_HOSTS\
        \ }}\" > ~/.ssh/known_hosts\ncat > audit.js <<'AUDIT_JS'\nconst {Database}=require('./dist/infrastructure/db/Database');\n\
        const {env}=require('./dist/common/env');\n(async()=>{const db=new Database(process.env.DATABASE_URL);try{\n\
        const operation='support-kaspi-control-20261123:5ffab48e3e5f2935c3e84a50fe61dde6412d3be882c059d57cee08b25411001e';\n\
        const base='https://core.mooonai.com/api/v1/organizations/'+env.moonAiOrganizationId+'/agents/'+env.moonAiAgentId;\n\
        const rows=(await db.query(\"SELECT p.*,o.id outbox_id,o.state delivery_state,o.payload\
        \ delivery_payload FROM payments p JOIN moon_ai_outbox o ON o.payment_id=p.id\
        \ AND o.kind='invoice' WHERE p.payload->>'supportTestKey'=$1\",[operation])).rows;\n\
        if(rows.length!==1)throw Error('control_payment_not_unique');const initial=rows[0];\n\
        if(Number(initial.amount)!==43||initial.order_id||initial.customer_package_id||initial.paid_at||initial.status!=='invoice_requested')throw\
        \ Error('control_payment_guard');\nconst request=async path=>{const response=await\
        \ fetch(base+path,{headers:{Authorization:'Bearer '+env.moonAiRestApiKey},signal:AbortSignal.timeout(15000)});if(!response.ok)throw\
        \ Error('provider_read_http_'+response.status);return response.json();};\n\
        const matches=await request('/threads?'+new URLSearchParams({message_text:initial.id,messengers:'api',limit:'5'}));\n\
        if(matches.results?.length!==1)throw Error('control_thread_not_unique');const\
        \ thread=matches.results[0];\nconst prior=await request('/threads/'+encodeURIComponent(thread.id)+'/messages?limit=50');\n\
        if(!initial.delivery_payload.controlRetryAfterFunding20261123){\n if(prior.count!==2||!prior.results?.some(m=>m.from_type==='system_insufficient_balance')||prior.results.some(m=>!['user','system_insufficient_balance'].includes(m.from_type)))throw\
        \ Error('provider_activity_changed_do_not_retry');\n}\nconst retry=await db.atomic(async()=>{\n\
        \ await db.query('SELECT pg_advisory_xact_lock(hashtextextended($1,0))',[operation]);\n\
        \ const payment=(await db.query('SELECT * FROM payments WHERE id=$1 FOR UPDATE',[initial.id])).rows[0];\n\
        \ const out=(await db.query('SELECT * FROM moon_ai_outbox WHERE id=$1 FOR\
        \ UPDATE',[initial.outbox_id])).rows[0];\n if(out.payload.controlRetryAfterFunding20261123)return\
        \ {dispatch:false,retryAt:out.payload.controlRetryAfterFunding20261123};\n\
        \ if(payment.status!=='invoice_requested'||payment.paid_at||Number(payment.amount)!==43||out.state!=='sent')throw\
        \ Error('retry_payment_guard');\n if((await db.query('SELECT 1 FROM moon_ai_payment_callbacks\
        \ WHERE payment_id=$1 LIMIT 1',[payment.id])).rows.length)throw Error('callback_already_exists_do_not_retry');\n\
        \ const at=new Date().toISOString();\n await db.query(\"UPDATE payments SET\
        \ invoice_requested_at=NOW(),updated_at=NOW() WHERE id=$1\",[payment.id]);\n\
        \ await db.query(\"UPDATE moon_ai_outbox SET state='processing',started_at=NOW(),finished_at=NULL,payload=payload||$2::jsonb\
        \ WHERE id=$1\",[out.id,{controlRetryAfterFunding20261123:at,apiDelivery:{phase:'http_started',attempt:2}}]);\n\
        \ await db.query(\"INSERT INTO audit_logs(action,entity_type,entity_id,payload)\
        \ VALUES('payment.control_invoice_recheck','payment',$1,$2)\",[payment.id,{source:'support',reason:'user_requested_recheck_after_confirmed_provider_balance_failure',previousNoInvoiceConfirmed:true,amount:43,samePayment:true,outboxId:out.id}]);\n\
        \ return {dispatch:true,retryAt:at,text:out.payload.text};\n});\nconst result={checkedAt:new\
        \ Date().toISOString(),testAmount:43,samePayment:true,retryDispatched:retry.dispatch,automaticPaymentPerformed:false};\n\
        if(retry.dispatch){\n const endpoint=new URL(env.moonAiChannelUrl);if(endpoint.protocol!=='https:'||!(endpoint.hostname==='mooonai.com'||endpoint.hostname.endsWith('.mooonai.com')))throw\
        \ Error('invalid_channel_url');\n try{\n  const response=await fetch(endpoint,{method:'POST',headers:{'X-API-Key':env.moonAiChannelApiKey,'Content-Type':'application/json'},body:JSON.stringify({thread_id:initial.outbox_id,source:env.moonAiSource+'_invoice',from_type:'user',message_type:'text',data:{text:retry.text}}),signal:AbortSignal.timeout(15000)});\n\
        \  const value=await response.json().catch(()=>null);result.httpStatus=response.status;result.apiAccepted=response.ok&&value?.accepted===true&&value.external_thread_id===initial.outbox_id;\n\
        \  await db.query(\"UPDATE moon_ai_outbox SET state=$2,provider_thread_id=COALESCE($3,provider_thread_id),failure_code=$4,finished_at=NOW()\
        \ WHERE id=$1\",[initial.outbox_id,result.apiAccepted?'sent':response.ok||response.status>=500?'uncertain':'failed',result.apiAccepted?value.thread_id:null,result.apiAccepted?null:response.ok?'invalid_acceptance':'http_'+response.status]);\n\
        \ }catch(e){result.transportError=e.cause?.code||e.code||e.name;await db.query(\"\
        UPDATE moon_ai_outbox SET state='uncertain',failure_code=$2,finished_at=NOW()\
        \ WHERE id=$1\",[initial.outbox_id,String(result.transportError).slice(0,100)]);}\n\
        }\nfor(let i=0;i<9;i++){\n const callbacks=(await db.query('SELECT status,resolution\
        \ FROM moon_ai_payment_callbacks WHERE payment_id=$1 ORDER BY received_at\
        \ DESC LIMIT 10',[initial.id])).rows;\n const payment=(await db.query('SELECT\
        \ status,paid_at IS NOT NULL paid FROM payments WHERE id=$1',[initial.id])).rows[0];\n\
        \ result.paymentStatus=payment.status;result.paid=payment.paid;result.callbackStatuses=callbacks.map(c=>c.status);result.invoiceConfirmed=payment.paid||callbacks.some(c=>c.status==='invoice_sent'||c.status==='paid');\n\
        \ if(result.invoiceConfirmed)break;\n if(result.transportError||result.apiAccepted===false)break;\n\
        \ try{\n  const messages=await request('/threads/'+encodeURIComponent(thread.id)+'/messages?limit=50');\n\
        \  const fresh=(messages.results??[]).filter(m=>Date.parse(m.at)>=Date.parse(retry.retryAt)-2000);\n\
        \  result.newMessageCount=fresh.length;\n  result.newSystemEvents=[...new\
        \ Set(fresh.map(m=>m.from_type).filter(t=>typeof t==='string'&&/^system_[a-z_]{1,70}$/.test(t)))];\n\
        \  result.newToolCalls=fresh.filter(m=>['tool','tool_call'].includes(m.message_type)).length;\n\
        \  if(result.newSystemEvents.some(t=>['system_insufficient_balance','system_usage_limit_exceeded','system_integration_error','system_kaspi_pay_payment_error','system_integration_disconnected','system_integration_phone_required'].includes(t)))break;\n\
        \ }catch(e){result.providerReadError=e.message||e.name;}\n await new Promise(r=>setTimeout(r,10000));\n\
        }\nconsole.log(JSON.stringify(result));\n}finally{await db.close();}})().catch(e=>{console.error('Guarded\
        \ control retry:',e.code||e.message||e.name);process.exitCode=1;});\nAUDIT_JS\n\
        cat > owner-public.pem <<'OWNER_KEY'\n-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtpV7I990CLe7oiiBN+m9\n\
        X7TcrpQ9mOEII5AAl9M30pOTPqq1J5Y+nJlhPZAPzutFZVbF0la9iQAoH5/H7sf6\n9ceTX5eJ3qeSCcx+P0iCyKW2mcmi7ov7kaqOuqiagN8zDRdyknrAELVMaQICSBUs\n\
        Gs7yAUZblblJTPQLoV0ZycxNrSOSCNqqh3tOtIOrZBjJMclLfd53keDMsxhls0k+\nivHkNJ0P3LyFkmYcDw6PEaMlFOsus5UK356pCMXPV8wpnef+44MEYiFV90cKRAY0\n\
        35e+JjAbeEoUGHKi+HxGUc7h3HdIN4XyIUuHdgbpUZJeFocElNvIFmXulmqOzd/6\n0exu9EUkZmkqzGF9U5KouIuw82jRSTvfTYE0CJF+JYUE7QfN0ehWXjEJYPIo2/tM\n\
        OjuZG5BnOJN+cDggJ5XLZrIGxJdz6P9KqfIbUuVuKHO/HA2ApgjVe2GvWPMgVbU+\n31f0te3sAhwXN8ieQDqw27LXBZt8MBRUefQxrfeakZb5AgMBAAE=\n\
        -----END PUBLIC KEY-----\nOWNER_KEY\nremote_dir=$(ssh -i ~/.ssh/deploy_key\
        \ -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\" 'mktemp -d /tmp/domly-invoice-error-audit-XXXXXX')\n\
        [[ \"$remote_dir\" =~ ^/tmp/domly-invoice-error-audit-[A-Za-z0-9]+$ ]]\ntrap\
        \ 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\"\
        \ \"rm -rf -- $remote_dir\" >/dev/null 2>&1 || true' EXIT\nscp -i ~/.ssh/deploy_key\
        \ -o IdentitiesOnly=yes audit.js owner-public.pem \"$VPS_USER@$VPS_HOST:$remote_dir/\"\
        \nssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\" \"\
        set -euo pipefail; cd '$DEPLOY_PATH/current' && umask 077 && timeout 240 docker\
        \ compose -p domly-backend exec -T api node - < '$remote_dir/audit.js' > '$remote_dir/report.json'\
        \ && openssl rand -out '$remote_dir/key.bin' 32 && openssl enc -aes-256-cbc\
        \ -salt -pbkdf2 -in '$remote_dir/report.json' -out '$remote_dir/report.enc'\
        \ -pass file:'$remote_dir/key.bin' && openssl pkeyutl -encrypt -pubin -inkey\
        \ '$remote_dir/owner-public.pem' -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256\
        \ -in '$remote_dir/key.bin' -out '$remote_dir/key.enc'\"\nmkdir -m 700 -p\
        \ encrypted-report\nscp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST:$remote_dir/report.enc\"\
        \ \"$VPS_USER@$VPS_HOST:$remote_dir/key.enc\" encrypted-report/\n"
    - uses: actions/upload-artifact@v4
      with:
        name: kaspi-control-trace-encrypted
        path: encrypted-report/
        retention-days: 1
        if-no-files-found: error
concurrency:
  group: support-kaspi-control-20261123
  cancel-in-progress: false
