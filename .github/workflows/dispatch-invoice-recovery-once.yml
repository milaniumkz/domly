name: Read-only authorized package and invoice error diagnosis
'on':
  push:
    branches:
    - support/deploy-invoice-recovery-20261117
    paths:
    - .github/workflows/dispatch-invoice-recovery-once.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
    - name: Read selected customer transaction state without sending or changing data
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      run: "set -euo pipefail\numask 077\nmkdir -p ~/.ssh\nprintf '%s' \"${{ secrets.VPS_SSH_PRIVATE_KEY_B64\
        \ }}\" | base64 -d > ~/.ssh/deploy_key\nprintf '%s\\n' \"${{ secrets.VPS_KNOWN_HOSTS\
        \ }}\" > ~/.ssh/known_hosts\ncat > audit.js <<'AUDIT_JS'\nconst {Pool}=require('pg');\n\
        (async()=>{const selectedHash='df16f55e998ce5c6df122df600c26fe8c46f70e19840c0f557aca7b5f3aa7a3a';\n\
        const db=new Pool({connectionString:process.env.DATABASE_URL});try{\n await\
        \ db.query('BEGIN READ ONLY');await db.query(\"SET LOCAL statement_timeout='10s'\"\
        );\n const users=(await db.query(\"SELECT id FROM app_users WHERE role='customer'\
        \ AND encode(sha256(convert_to(regexp_replace(phone,'[^0-9]','','g'),'UTF8')),'hex')=$1\"\
        ,[selectedHash])).rows;\n const result={at:new Date().toISOString(),matchingCustomers:users.length};\n\
        \ if(users.length===1){const id=users[0].id;\n result.events=(await db.query(`SELECT\
        \ started_at,finished_at,source,result,http_status,error_code,CASE WHEN source='server'\
        \ THEN failure_reason END failure_reason,platform,app_version,\n regexp_replace(action,'[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}','[id]','g')\
        \ action\n FROM tech_events WHERE user_id=$1 AND started_at>NOW()-INTERVAL\
        \ '7 days'\n AND (action ~ '^(POST|PATCH|PUT|DELETE) ' OR result IN ('failure','interrupted','reported'))\
        \ AND (action ILIKE '%payment%' OR action ILIKE '%package%' OR action ILIKE\
        \ '%order%' OR source='client') ORDER BY started_at DESC LIMIT 100`,[id])).rows;\n\
        \ const payments=(await db.query(`SELECT id,status,provider,created_at,updated_at,invoice_requested_at,paid_at\
        \ IS NOT NULL is_paid,\n invoice_phone IS NOT NULL has_invoice_phone,regexp_replace(COALESCE(invoice_phone,''),'[^0-9]','','g')\
        \ ~ '^7[0-9]{10}$' stored_phone_matches_required_format\n FROM payments WHERE\
        \ customer_id=$1 ORDER BY created_at DESC LIMIT 10`,[id])).rows;\n result.coverage=(await\
        \ db.query(`SELECT a.is_primary,domly_service_zones_enforced() enforced,\n\
        \ domly_location_in_service_zone(a.city,a.street,a.house,a.latitude,a.longitude)\
        \ allowed,\n a.latitude IS NOT NULL AND a.longitude IS NOT NULL has_coordinates,\n\
        \ domly_city_key(a.city)='астана' city_is_astana,domly_address_key(a.house)='3'\
        \ house_is_three,\n EXISTS(SELECT 1 FROM service_zones z WHERE z.active AND\
        \ domly_city_key(z.city)=domly_city_key(a.city) AND domly_polygon_contains(z.polygon,a.latitude,a.longitude))\
        \ point_inside_active_zone,\n (SELECT COUNT(*)::int FROM connected_houses\
        \ h WHERE domly_city_key(h.city)=domly_city_key(a.city) AND domly_address_key(h.house)=domly_address_key(a.house)\n\
        \ AND (domly_street_key(h.street_ru)=domly_street_key(a.street) OR domly_street_key(h.street_kk)=domly_street_key(a.street)))\
        \ exact_house_records,\n (SELECT COUNT(*)::int FROM connected_houses h JOIN\
        \ service_zones z ON z.id=h.zone_id WHERE h.active AND z.active AND domly_city_key(h.city)=domly_city_key(a.city)\
        \ AND domly_city_key(z.city)=domly_city_key(a.city) AND domly_address_key(h.house)=domly_address_key(a.house)\n\
        \ AND (domly_street_key(h.street_ru)=domly_street_key(a.street) OR domly_street_key(h.street_kk)=domly_street_key(a.street)))\
        \ exact_active_house_records,\n (SELECT COUNT(*)::int FROM connected_houses\
        \ h JOIN service_zones z ON z.id=h.zone_id WHERE h.active AND z.active AND\
        \ domly_city_key(h.city)=domly_city_key(a.city) AND domly_city_key(z.city)=domly_city_key(a.city)\
        \ AND domly_address_key(h.house)=domly_address_key(a.house)\n AND domly_street_key(regexp_replace(lower(h.street_ru),'^(мкрн?|микрорайон)[.]?[[:space:]]*','','g'))=domly_street_key(regexp_replace(lower(a.street),'^(мкрн?|микрорайон)[.]?[[:space:]]*','','g')))\
        \ active_house_records_without_district_prefix\n FROM customer_addresses a\
        \ WHERE a.user_id=$1`,[id])).rows;\n result.addresses=(await db.query(`SELECT\
        \ is_primary,service_status,area>0 has_area,verified_area>0 has_verified_area,area_reverification_required\
        \ FROM customer_addresses WHERE user_id=$1`,[id])).rows;\n result.qualityChecks=(await\
        \ db.query(`SELECT status,document_file_id IS NOT NULL has_document,customer_package_id\
        \ IS NOT NULL linked_to_package,order_id IS NOT NULL linked_to_order,created_at,updated_at\
        \ FROM quality_check_requests WHERE customer_id=$1 ORDER BY created_at DESC\
        \ LIMIT 10`,[id])).rows;\n result.packages=(await db.query(`SELECT status,total_cleanings,available_cleanings,created_at,updated_at\
        \ FROM customer_packages WHERE customer_id=$1 ORDER BY created_at DESC LIMIT\
        \ 10`,[id])).rows;\n result.idempotency=(await db.query(`SELECT regexp_replace(scope,'[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}','[id]','g')\
        \ scope,status_code,recovery_safe,created_at,completed_at,response->>'code'\
        \ error_code FROM api_idempotency WHERE user_id=$1 ORDER BY created_at DESC\
        \ LIMIT 20`,[id])).rows;\n result.payments=payments.map(({id,...row})=>row);\n\
        \ result.delivery=(await db.query(`SELECT kind,state,failure_code,created_at,run_after,started_at,finished_at,\n\
        \ payload#>>'{apiDelivery,phase}' phase,payload#>>'{apiDelivery,attempt}'\
        \ attempt\n FROM moon_ai_outbox WHERE customer_id=$1 AND kind='invoice' ORDER\
        \ BY created_at DESC LIMIT 20`,[id])).rows;\n }\n await db.query('ROLLBACK');console.log(JSON.stringify(result));\n\
        }finally{await db.end();}})().catch(e=>{console.error(e.code||e.name);process.exitCode=1;});\n\
        \nAUDIT_JS\ncat > owner-public.pem <<'OWNER_KEY'\n-----BEGIN PUBLIC KEY-----\n\
        MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtpV7I990CLe7oiiBN+m9\nX7TcrpQ9mOEII5AAl9M30pOTPqq1J5Y+nJlhPZAPzutFZVbF0la9iQAoH5/H7sf6\n\
        9ceTX5eJ3qeSCcx+P0iCyKW2mcmi7ov7kaqOuqiagN8zDRdyknrAELVMaQICSBUs\nGs7yAUZblblJTPQLoV0ZycxNrSOSCNqqh3tOtIOrZBjJMclLfd53keDMsxhls0k+\n\
        ivHkNJ0P3LyFkmYcDw6PEaMlFOsus5UK356pCMXPV8wpnef+44MEYiFV90cKRAY0\n35e+JjAbeEoUGHKi+HxGUc7h3HdIN4XyIUuHdgbpUZJeFocElNvIFmXulmqOzd/6\n\
        0exu9EUkZmkqzGF9U5KouIuw82jRSTvfTYE0CJF+JYUE7QfN0ehWXjEJYPIo2/tM\nOjuZG5BnOJN+cDggJ5XLZrIGxJdz6P9KqfIbUuVuKHO/HA2ApgjVe2GvWPMgVbU+\n\
        31f0te3sAhwXN8ieQDqw27LXBZt8MBRUefQxrfeakZb5AgMBAAE=\n-----END PUBLIC KEY-----\n\
        OWNER_KEY\nremote_dir=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"\
        $VPS_USER@$VPS_HOST\" 'mktemp -d /tmp/domly-invoice-error-audit-XXXXXX')\n\
        [[ \"$remote_dir\" =~ ^/tmp/domly-invoice-error-audit-[A-Za-z0-9]+$ ]]\ntrap\
        \ 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\"\
        \ \"rm -rf -- $remote_dir\" >/dev/null 2>&1 || true' EXIT\nscp -i ~/.ssh/deploy_key\
        \ -o IdentitiesOnly=yes audit.js owner-public.pem \"$VPS_USER@$VPS_HOST:$remote_dir/\"\
        \nssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\" \"\
        set -euo pipefail; cd '$DEPLOY_PATH/current' && umask 077 && timeout 240 docker\
        \ compose -p domly-backend exec -T api node - < '$remote_dir/audit.js' > '$remote_dir/report.json'\
        \ && openssl rand -out '$remote_dir/key.bin' 32 && openssl enc -aes-256-cbc\
        \ -salt -pbkdf2 -in '$remote_dir/report.json' -out '$remote_dir/report.enc'\
        \ -pass file:'$remote_dir/key.bin' && openssl pkeyutl -encrypt -pubin -inkey\
        \ '$remote_dir/owner-public.pem' -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256\
        \ -in '$remote_dir/key.bin' -out '$remote_dir/key.enc'\"\nmkdir -m 700 -p\
        \ encrypted-report\nscp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST:$remote_dir/report.enc\"\
        \ \"$VPS_USER@$VPS_HOST:$remote_dir/key.enc\" encrypted-report/\n"
    - uses: actions/upload-artifact@v4
      with:
        name: invoice-error-audit-encrypted
        path: encrypted-report/
        retention-days: 1
        if-no-files-found: error
