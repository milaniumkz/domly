name: Build requested admin APK 1.0.22 (32)
permissions:
  contents: write
concurrency:
  group: admin-apk-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 1634de1f977d73bc21545e35417a5f66f94ba356
        persist-credentials: false
    - name: Validate version
      env:
        APK_VERSION: 1.0.22
        APK_BUILD: '32'
      run: '[[ "$APK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

        [[ "$APK_BUILD" =~ ^[1-9][0-9]*$ ]]

        printf ''APK_VERSION=%s\nAPK_BUILD=%s\nAPK_TAG=admin-apk-%s-%s-%s\n'' "$APK_VERSION"
        "$APK_BUILD" "$APK_VERSION" "$APK_BUILD" "$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

        '
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.44.1
        cache: true
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Prepare Android SDK
      run: sdkmanager 'build-tools;35.0.0' 'platforms;android-34' 'platforms;android-35'
        'platforms;android-36' 'ndk;28.2.13676358' 'cmake;3.22.1'
    - name: Resolve Flutter Gradle plugins through Maven Central
      run: 'python3 - <<''PYCODE''

        import os

        from pathlib import Path

        p=Path(os.environ[''FLUTTER_ROOT''])/''packages/flutter_tools/gradle/settings.gradle.kts''

        s=p.read_text()

        assert ''pluginManagement'' not in s

        p.write_text(''pluginManagement { repositories { google(); mavenCentral();
        gradlePluginPortal() } }\n''+s)

        PYCODE'
    - name: Build and verify APK
      env:
        FLUTTER_BIN: flutter
      run: 'bash scripts/build_android_domly_admin.sh --build-name="$APK_VERSION"
        --build-number="$APK_BUILD"

        mkdir -p apk-release

        cp build/app/outputs/flutter-apk/app-domlyadmin-release.apk "apk-release/DomLY-Admin-$APK_VERSION-$APK_BUILD.apk"

        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs
        "apk-release/DomLY-Admin-$APK_VERSION-$APK_BUILD.apk"

        "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "apk-release/DomLY-Admin-$APK_VERSION-$APK_BUILD.apk"
        > apk-release/badging.txt

        sed -n ''1,20p'' apk-release/badging.txt

        (cd apk-release && sha256sum "DomLY-Admin-$APK_VERSION-$APK_BUILD.apk" > "DomLY-Admin-$APK_VERSION-$APK_BUILD.apk.sha256")

        '
    - name: Publish approved preliminary admin release
      env:
        GH_TOKEN: ${{ github.token }}
      run: "gh release create \"$APK_TAG\" apk-release/*.apk apk-release/*.sha256\
        \ \\\n  --repo \"$GITHUB_REPOSITORY\" --target \"1634de1f977d73bc21545e35417a5f66f94ba356\"\
        \ --prerelease --latest=false \\\n  --title \"DomLY Admin $APK_VERSION ($APK_BUILD)\
        \ — APK\" \\\n  --notes 'APK админки для ручной установки. Актуальная админка:\
        \ CRM, заметки, фильтры и отменённые счета. Подпись Android Debug; поверх\
        \ APK с другим ключом не установится. Данные аккаунта хранятся на сервере.\
        \ Не выпуск для магазинов.'\n"
'on':
  push:
    branches:
    - support/deploy-invoice-recovery-20261117
    paths:
    - .github/workflows/dispatch-invoice-recovery-once.yml

