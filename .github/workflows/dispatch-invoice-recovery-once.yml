name: Repair verified repeated schema constraint and recover current services
'on':
  push:
    branches:
    - support/deploy-invoice-recovery-20261117
    paths:
    - .github/workflows/dispatch-invoice-recovery-once.yml
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
    - name: Back up DB, apply checksum-verified compatibility repair and restore API/worker
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      run: "set -euo pipefail\numask 077\nmkdir -p ~/.ssh\nprintf '%s' \"${{ secrets.VPS_SSH_PRIVATE_KEY_B64\
        \ }}\" | base64 -d > ~/.ssh/deploy_key\nprintf '%s\\n' \"${{ secrets.VPS_KNOWN_HOSTS\
        \ }}\" > ~/.ssh/known_hosts\ncat > repair.py <<'REPAIR'\nimport sys,pathlib,hashlib,subprocess,re,datetime,urllib.request,time,json,os\n\
        root=pathlib.Path(sys.argv[1]);current=root/'current'\nexpected='6760e54c0b19e1e9f7d67578d959cfc71a7f9aa7'\n\
        assert current.resolve().name==expected,'unexpected_current_release'\nsource=current/'backend/sql/schema.sql';raw=source.read_bytes()\n\
        oldhash='e8beafc164562d6a402ca57a1e49807f4abf54ab525795a4dd9bb4234f446fd7';newhash='6a5d960cdd6a44394e64c2fc55c3aff98829bdddaab74b504f27f366d885f438'\n\
        assert hashlib.sha256(raw).hexdigest() in [oldhash,newhash],'unexpected_schema'\n\
        prefix=['docker','compose','-p','domly-backend','-f',str(current/'docker-compose.yml'),'--project-directory',str(current)]\n\
        def command(args):\n p=subprocess.run(args,capture_output=True,text=True,timeout=90)\n\
        \ if p.returncode:raise RuntimeError('container_operation_failed')\n return\
        \ p.stdout.strip()\ndef cid(service):\n value=command(prefix+['ps','--all','-q',service]);assert\
        \ re.fullmatch('[a-f0-9]{12,64}',value),'container_not_unique';return value\n\
        api,worker,postgres=cid('api'),cid('worker'),cid('postgres')\nbackup=root/'backups'/('fcm-schema-repair-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M%S'));backup.mkdir(mode=0o700)\n\
        (backup/'schema.sql.before').write_bytes(raw)\nwith (backup/'postgres.sql').open('wb')\
        \ as f:\n p=subprocess.run(['docker','exec',postgres,'sh','-c','exec pg_dump\
        \ -U \"${POSTGRES_USER:-domly}\" \"${POSTGRES_DB:-domly}\"'],stdout=f,stderr=subprocess.PIPE,timeout=120)\n\
        \ assert p.returncode==0,'backup_failed'\ns=raw.decode();new=\"CHECK(kind\
        \ IN ('invoice','message','abandoned_checkout','inactive_signup','inactive_install','area_verification','address_reverification','package_renewal'))\"\
        \nfor old in [\"CHECK(kind IN ('invoice','message','abandoned_checkout','inactive_signup','inactive_install'))\"\
        ,\"CHECK(kind IN ('invoice','message','abandoned_checkout','inactive_signup','inactive_install','area_verification','address_reverification'))\"\
        ]:s=s.replace(old,new)\nassert hashlib.sha256(s.encode()).hexdigest()==newhash,'patch_mismatch'\n\
        command(['docker','stop','-t','10',api,worker])\ntry:\n source.write_text(s)\n\
        \ for container in [api,worker]:command(['docker','cp',str(source),container+':/app/sql/schema.sql'])\n\
        finally:\n command(['docker','start',api,worker])\nconsecutive=0\nfor attempt\
        \ in range(90):\n try:\n  ready=all(urllib.request.urlopen('http://127.0.0.1:8080/'+p,timeout=5).status==200\
        \ for p in ['health','ready'])\n  running=all(json.loads(command(['docker','inspect','--format','{{json\
        \ .State}}',container])).get('Running') for container in [api,worker])\n \
        \ consecutive=consecutive+1 if ready and running else 0\n  if consecutive>=3:print(json.dumps({'schema_fixed':True,'api_ready':True,'worker_running':True}));break\n\
        \ except Exception:consecutive=0\n time.sleep(2)\nelse:raise RuntimeError('services_not_ready_after_repair')\n\
        REPAIR\nremote_dir=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\"\
        \ 'mktemp -d /tmp/domly-schema-repair-XXXXXX')\n[[ \"$remote_dir\" =~ ^/tmp/domly-schema-repair-[A-Za-z0-9]+$\
        \ ]]\ntrap 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\"\
        \ \"rm -rf -- $remote_dir\" >/dev/null 2>&1 || true' EXIT\nscp -i ~/.ssh/deploy_key\
        \ -o IdentitiesOnly=yes repair.py \"$VPS_USER@$VPS_HOST:$remote_dir/\"\nssh\
        \ -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\" \"umask\
        \ 077; python3 '$remote_dir/repair.py' '$DEPLOY_PATH'\"\n"
