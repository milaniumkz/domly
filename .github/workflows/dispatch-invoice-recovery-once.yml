name: Deploy checked quality visit display compatibility
'on':
  push:
    branches:
    - support/deploy-invoice-recovery-20261117
    paths:
    - .github/workflows/dispatch-invoice-recovery-once.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Release an unstarted duplicate and dispatch standard checked main deployment
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nrepo=milaniumkz/domly\nexpected=cd4cc33075d48b5fb8b67970c73f43d87e347ec9\n\
        test \"$(gh api \"repos/$repo/git/ref/heads/main\" --jq .object.sha)\" = \"\
        $expected\"\ntest \"$(gh api \"repos/$repo/actions/runs/45007567397\" --jq\
        \ .conclusion)\" = success\ngh api \"repos/$repo/actions/runs?head_sha=$expected&per_page=10\"\
        \ > runs.json\nqueued=$(python3 - <<'PYCODE'\nimport json\nruns=json.load(open('runs.json'))['workflow_runs']\n\
        ids=[str(r['id']) for r in runs if r['path']=='.github/workflows/deploy.yml'\
        \ and r['event']=='push' and r['status'] in ['queued','pending','in_progress']]\n\
        assert len(ids)<=1\nprint(ids[0] if ids else '')\nPYCODE\n)\nif [ -n \"$queued\"\
        \ ]; then\n gh api \"repos/$repo/actions/runs/$queued/jobs\" > jobs.json\n\
        \ python3 - <<'PYCODE'\nimport json\njobs=json.load(open('jobs.json'))['jobs']\n\
        assert all(j['status']=='queued' or j.get('conclusion')=='skipped' for j in\
        \ jobs), 'Only a fully unstarted automatic deployment may be replaced'\nPYCODE\n\
        \ gh api -X POST \"repos/$repo/actions/runs/$queued/cancel\"\nfi\ngh api -X\
        \ POST \"repos/$repo/actions/workflows/deploy.yml/dispatches\" --input - <<'JSON'\n\
        {\"ref\":\"main\",\"inputs\":{\"mode\":\"deploy\",\"reuse_web_from_run\":\"\
        44066261691\"}}\nJSON\n"

