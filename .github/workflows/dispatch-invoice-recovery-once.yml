name: Locate only the control invoice thread by its unique payment reference
'on':
  push:
    branches:
    - support/deploy-invoice-recovery-20261117
    paths:
    - .github/workflows/dispatch-invoice-recovery-once.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
    - name: Read only control invoice technical metadata and encrypt locally before
        upload
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      run: "set -euo pipefail\numask 077\nmkdir -p ~/.ssh\nprintf '%s' \"${{ secrets.VPS_SSH_PRIVATE_KEY_B64\
        \ }}\" | base64 -d > ~/.ssh/deploy_key\nprintf '%s\\n' \"${{ secrets.VPS_KNOWN_HOSTS\
        \ }}\" > ~/.ssh/known_hosts\ncat > audit.js <<'AUDIT_JS'\nconst {Pool}=require('pg');\n\
        (async()=>{const db=new Pool({connectionString:process.env.DATABASE_URL});try{\n\
        const operation='support-kaspi-control-20261123:5ffab48e3e5f2935c3e84a50fe61dde6412d3be882c059d57cee08b25411001e';\n\
        const rows=(await db.query(\"SELECT p.id,p.status,p.external_id IS NOT NULL\
        \ has_external_invoice,p.paid_at IS NOT NULL paid,p.created_at,o.provider_thread_id,o.state,o.failure_code\
        \ FROM payments p LEFT JOIN moon_ai_outbox o ON o.payment_id=p.id AND o.kind='invoice'\
        \ WHERE p.payload->>'supportTestKey'=$1\",[operation])).rows;\nif(rows.length!==1)throw\
        \ Error('test_not_unique');const p=rows[0];\nconst callbacks=(await db.query('SELECT\
        \ status,resolution FROM moon_ai_payment_callbacks WHERE payment_id=$1 ORDER\
        \ BY received_at DESC LIMIT 10',[p.id])).rows;\nconst result={testAmount:43,paymentStatus:p.status,paid:p.paid,hasExternalInvoice:p.has_external_invoice,deliveryState:p.state,deliveryFailure:p.failure_code,callbacks,invoiceConfirmed:callbacks.some(c=>c.status==='invoice_sent'||c.status==='paid')||p.paid};\n\
        result.callbackHttp=(await db.query(\"SELECT result,http_status,error_code\
        \ FROM tech_events WHERE fields->>'paymentId'=$1 AND started_at>=$2 AND action\
        \ LIKE '%moon-ai%' ORDER BY started_at DESC LIMIT 10\",[p.id,p.created_at])).rows;\n\
        if(!result.invoiceConfirmed&&p.provider_thread_id&&process.env.MOON_AI_REST_API_KEY){\n\
        \ const base='https://core.mooonai.com/api/v1/organizations/'+process.env.MOON_AI_ORGANIZATION_ID+'/agents/'+process.env.MOON_AI_AGENT_ID;\n\
        \ result.providerReads=[];\n const credential=process.env.MOON_AI_REST_API_KEY;result.restCredentialStyle=credential.split('.').length===3?'jwt':'opaque';\n\
        \ if(result.restCredentialStyle==='jwt'){try{const claim=JSON.parse(Buffer.from(credential.split('.')[1],'base64url').toString());result.restCredentialExpired=typeof\
        \ claim.exp==='number'&&claim.exp*1000<=Date.now();}catch{result.restCredentialMalformed=true;}}\n\
        \ try{const check=await fetch(base+'/channels/',{headers:{Authorization:'Bearer\
        \ '+credential},signal:AbortSignal.timeout(15000)});result.providerChannelReadStatus=check.status;await\
        \ check.body?.cancel();}catch(e){result.providerChannelReadError=e.cause?.code||e.code||e.name;}\n\
        \n let readThreadId=p.provider_thread_id;\n try{\n  const lookup=await fetch(base+'/threads?'+new\
        \ URLSearchParams({message_text:p.id,messengers:'api',limit:'5'}),{headers:{Authorization:'Bearer\
        \ '+process.env.MOON_AI_REST_API_KEY},signal:AbortSignal.timeout(15000)});\n\
        \  const value=await lookup.json().catch(()=>null);const list=Array.isArray(value?.results)?value.results:[];\n\
        \  result.exactControlLookup={httpStatus:lookup.status,count:list.length,storedThreadIdMatched:list.some(r=>String(r.id)===p.provider_thread_id)};\n\
        \  if(lookup.ok&&list.length===1){const item=list[0];readThreadId=String(item.id);result.exactControlLookup.threadState=item.status;result.exactControlLookup.hasError=item.has_error===true;if(['operator','blocked'].includes(item.pause_reason))result.exactControlLookup.pauseReason=item.pause_reason;}\n\
        \ }catch(e){result.exactControlLookup={error:e.cause?.code||e.code||e.name};}\n\
        \ result.controlPaymentId=p.id;result.providerThreadId=readThreadId;\n for(const\
        \ [label,path] of [['thread','/threads/'+encodeURIComponent(readThreadId)],['messages','/threads/'+encodeURIComponent(readThreadId)+'/messages?limit=50']]){\n\
        \  const info={label};try{\n   const response=await fetch(base+path,{headers:{Authorization:'Bearer\
        \ '+process.env.MOON_AI_REST_API_KEY},signal:AbortSignal.timeout(15000)});info.httpStatus=response.status;\n\
        \   const value=await response.json().catch(()=>null);info.keys=value&&typeof\
        \ value==='object'?Object.keys(value).filter(k=>/^[a-z_]{1,40}$/.test(k)).slice(0,30):[];\n\
        \   const state=value?.status??value?.thread_status??value?.data?.status;if(['active','paused','completed','failed','error','processing','queued','running','stopped','closed'].includes(state))info.threadState=state;info.threadHasError=value?.has_error===true;if(['operator','blocked'].includes(value?.pause_reason))info.pauseReason=value.pause_reason;\n\
        \   const messages=Array.isArray(value)?value:([value?.results,value?.messages,value?.data?.results,value?.data?.messages,value?.data].find(Array.isArray)??[]);\n\
        \   info.messageCount=messages.length;\n   info.systemEvents=[...new Set(messages.map(m=>m.from_type).filter(t=>typeof\
        \ t==='string'&&/^system_[a-z_]{1,70}$/.test(t)))];\n\n   const checks={internal_server_error:/internal\
        \ server error|internal_server_error/i,insufficient_balance:/insufficient\
        \ (balance|funds|credits)|недостаточно (средств|баланса)|баланс.*(исчерпан|законч)/i,quota_exceeded:/quota.*exceed|квот.*(исчерпан|превыш)/i,rate_limit:/rate.?limit|too\
        \ many requests/i,authentication_error:/unauthori[sz]ed|invalid.?api.?key|authentication\
        \ failed|неверн.*(токен|ключ)/i,permission_denied:/permission denied|forbidden|доступ\
        \ запрещен/i,tool_execution_error:/tool.*(failed|error)|ошибка.*(функци|интеграци)|failed\
        \ to (create|execute)/i,invoice_creation_error:/не удалось (создать|выставить).*сч[её]т|invoice.*(failed|error)/i};\n\
        \   const tools=new Set(),flags=new Set();let visited=0;\n   const walk=(v,depth=0)=>{if(depth>12||++visited>10000||v==null)return;\n\
        \    if(Array.isArray(v)){for(const item of v)walk(item,depth+1);return;}\n\
        \    if(typeof v==='object'){\n     if(['user','customer'].includes(v.from_type??v.role))return;\n\
        \     if(['create_order','create_payment','set_info','get_info'].includes(v.function?.name))tools.add(v.function.name);\n\
        \     if(['create_order','create_payment','set_info','get_info'].includes(v.name))tools.add(v.name);\n\
        \     for(const [k,x] of Object.entries(v))if(!/token|secret|authorization|api.?key|phone|arguments|parameters/i.test(k))walk(x,depth+1);return;\n\
        \    }\n    if(typeof v==='string')for(const [flag,pattern] of Object.entries(checks))if(pattern.test(v))flags.add(flag);\n\
        \   };\n   walk(value);info.toolNames=[...tools];info.errorFlags=[...flags];\n\
        \  }catch(e){info.error=e.cause?.code||e.code||e.name;}result.providerReads.push(info);\n\
        \ }\n}\nconsole.log(JSON.stringify(result));\n}finally{await db.end();}})().catch(e=>{console.error(e.code||e.message||e.name);process.exitCode=1;});\n\
        AUDIT_JS\ncat > owner-public.pem <<'OWNER_KEY'\n-----BEGIN PUBLIC KEY-----\n\
        MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtpV7I990CLe7oiiBN+m9\nX7TcrpQ9mOEII5AAl9M30pOTPqq1J5Y+nJlhPZAPzutFZVbF0la9iQAoH5/H7sf6\n\
        9ceTX5eJ3qeSCcx+P0iCyKW2mcmi7ov7kaqOuqiagN8zDRdyknrAELVMaQICSBUs\nGs7yAUZblblJTPQLoV0ZycxNrSOSCNqqh3tOtIOrZBjJMclLfd53keDMsxhls0k+\n\
        ivHkNJ0P3LyFkmYcDw6PEaMlFOsus5UK356pCMXPV8wpnef+44MEYiFV90cKRAY0\n35e+JjAbeEoUGHKi+HxGUc7h3HdIN4XyIUuHdgbpUZJeFocElNvIFmXulmqOzd/6\n\
        0exu9EUkZmkqzGF9U5KouIuw82jRSTvfTYE0CJF+JYUE7QfN0ehWXjEJYPIo2/tM\nOjuZG5BnOJN+cDggJ5XLZrIGxJdz6P9KqfIbUuVuKHO/HA2ApgjVe2GvWPMgVbU+\n\
        31f0te3sAhwXN8ieQDqw27LXBZt8MBRUefQxrfeakZb5AgMBAAE=\n-----END PUBLIC KEY-----\n\
        OWNER_KEY\nremote_dir=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"\
        $VPS_USER@$VPS_HOST\" 'mktemp -d /tmp/domly-invoice-error-audit-XXXXXX')\n\
        [[ \"$remote_dir\" =~ ^/tmp/domly-invoice-error-audit-[A-Za-z0-9]+$ ]]\ntrap\
        \ 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\"\
        \ \"rm -rf -- $remote_dir\" >/dev/null 2>&1 || true' EXIT\nscp -i ~/.ssh/deploy_key\
        \ -o IdentitiesOnly=yes audit.js owner-public.pem \"$VPS_USER@$VPS_HOST:$remote_dir/\"\
        \nssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\" \"\
        set -euo pipefail; cd '$DEPLOY_PATH/current' && umask 077 && timeout 240 docker\
        \ compose -p domly-backend exec -T api node - < '$remote_dir/audit.js' > '$remote_dir/report.json'\
        \ && openssl rand -out '$remote_dir/key.bin' 32 && openssl enc -aes-256-cbc\
        \ -salt -pbkdf2 -in '$remote_dir/report.json' -out '$remote_dir/report.enc'\
        \ -pass file:'$remote_dir/key.bin' && openssl pkeyutl -encrypt -pubin -inkey\
        \ '$remote_dir/owner-public.pem' -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256\
        \ -in '$remote_dir/key.bin' -out '$remote_dir/key.enc'\"\nmkdir -m 700 -p\
        \ encrypted-report\nscp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST:$remote_dir/report.enc\"\
        \ \"$VPS_USER@$VPS_HOST:$remote_dir/key.enc\" encrypted-report/\n"
    - uses: actions/upload-artifact@v4
      with:
        name: kaspi-control-trace-encrypted
        path: encrypted-report/
        retention-days: 1
        if-no-files-found: error

