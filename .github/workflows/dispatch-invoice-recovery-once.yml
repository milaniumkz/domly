name: Release queued duplicate deployment once
'on':
  push:
    branches:
    - support/deploy-invoice-recovery-20261117
    paths:
    - .github/workflows/dispatch-invoice-recovery-once.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Cancel only the old deployment still waiting for a runner
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        repo=milaniumkz/domly

        head=$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)

        test "$head" = f8c76ab794bb62167ef7c5ec9cda180b1fc81a69

        gh api "repos/$repo/actions/runs/44042757869/jobs" > jobs.json

        python3 - <<''PYCODE''

        import json

        jobs=json.load(open(''jobs.json''))[''jobs'']

        assert not any(j[''name'']==''deploy'' and j[''status'']!=''queued'' for j
        in jobs), ''Never cancel an active production deployment''

        assert all(j[''status'']==''queued'' or j.get(''conclusion'')==''skipped''
        for j in jobs), ''Expected a fully queued duplicate''

        PYCODE

        gh api -X POST "repos/$repo/actions/runs/44042757869/cancel"

        '
