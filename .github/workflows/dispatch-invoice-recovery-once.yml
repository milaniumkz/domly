name: Read-only authorized latest cleaner upload diagnosis
'on':
  push:
    branches:
    - support/deploy-invoice-recovery-20261117
    paths:
    - .github/workflows/dispatch-invoice-recovery-once.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
    - name: Read latest cleaner upload results without document contents or personal
        identifiers
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      run: 'set -euo pipefail

        umask 077

        mkdir -p ~/.ssh

        printf ''%s'' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key

        printf ''%s\n'' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

        cat > audit.js <<''AUDIT_JS''

        const {Pool}=require(''pg'');

        (async()=>{const db=new Pool({connectionString:process.env.DATABASE_URL});try{

        await db.query(''BEGIN READ ONLY'');await db.query("SET LOCAL statement_timeout=''10s''");

        const selected=(await db.query(`SELECT d.cleaner_id,max(d.created_at) last_submitted_at
        FROM cleaner_documents d JOIN app_users u ON u.id=d.cleaner_id WHERE u.role=''cleaner''
        GROUP BY d.cleaner_id ORDER BY max(d.created_at) DESC LIMIT 1`)).rows[0];

        const result={at:new Date().toISOString(),found:!!selected};

        if(selected){const id=selected.cleaner_id;result.lastSubmittedAt=selected.last_submitted_at;

        result.attempts=(await db.query(`SELECT started_at,finished_at,source,action,result,http_status,error_code,platform,app_version
        FROM tech_events WHERE user_id=$1 AND started_at>NOW()-INTERVAL ''1 day''
        AND action IN (''POST /api/v1/files'',''POST /api/v1/cleaner/verification'')
        ORDER BY started_at DESC LIMIT 100`,[id])).rows;

        result.fileCounts=(await db.query(`SELECT COUNT(*)::int uploaded_last_day,COUNT(*)
        FILTER(WHERE EXISTS(SELECT 1 FROM cleaner_documents d WHERE d.file_id=f.id
        AND d.cleaner_id=$1))::int linked_to_verification FROM files f WHERE f.owner_id=$1
        AND f.created_at>NOW()-INTERVAL ''1 day''`,[id])).rows;

        result.submissions=(await db.query(`SELECT date_trunc(''minute'',created_at)
        sent_at,COUNT(*)::int file_count FROM cleaner_documents WHERE cleaner_id=$1
        AND created_at>NOW()-INTERVAL ''1 day'' GROUP BY date_trunc(''minute'',created_at)
        ORDER BY sent_at DESC LIMIT 10`,[id])).rows;}

        await db.query(''ROLLBACK'');console.log(JSON.stringify(result));

        }finally{await db.end();}})().catch(e=>{console.error(e.code||e.name);process.exitCode=1;});

        AUDIT_JS

        cat > owner-public.pem <<''OWNER_KEY''

        -----BEGIN PUBLIC KEY-----

        MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtpV7I990CLe7oiiBN+m9

        X7TcrpQ9mOEII5AAl9M30pOTPqq1J5Y+nJlhPZAPzutFZVbF0la9iQAoH5/H7sf6

        9ceTX5eJ3qeSCcx+P0iCyKW2mcmi7ov7kaqOuqiagN8zDRdyknrAELVMaQICSBUs

        Gs7yAUZblblJTPQLoV0ZycxNrSOSCNqqh3tOtIOrZBjJMclLfd53keDMsxhls0k+

        ivHkNJ0P3LyFkmYcDw6PEaMlFOsus5UK356pCMXPV8wpnef+44MEYiFV90cKRAY0

        35e+JjAbeEoUGHKi+HxGUc7h3HdIN4XyIUuHdgbpUZJeFocElNvIFmXulmqOzd/6

        0exu9EUkZmkqzGF9U5KouIuw82jRSTvfTYE0CJF+JYUE7QfN0ehWXjEJYPIo2/tM

        OjuZG5BnOJN+cDggJ5XLZrIGxJdz6P9KqfIbUuVuKHO/HA2ApgjVe2GvWPMgVbU+

        31f0te3sAhwXN8ieQDqw27LXBZt8MBRUefQxrfeakZb5AgMBAAE=

        -----END PUBLIC KEY-----

        OWNER_KEY

        remote_dir=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST"
        ''mktemp -d /tmp/domly-invoice-error-audit-XXXXXX'')

        [[ "$remote_dir" =~ ^/tmp/domly-invoice-error-audit-[A-Za-z0-9]+$ ]]

        trap ''ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST"
        "rm -rf -- $remote_dir" >/dev/null 2>&1 || true'' EXIT

        scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes audit.js owner-public.pem "$VPS_USER@$VPS_HOST:$remote_dir/"

        ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "set
        -euo pipefail; cd ''$DEPLOY_PATH/current'' && umask 077 && timeout 240 docker
        compose -p domly-backend exec -T api node - < ''$remote_dir/audit.js'' > ''$remote_dir/report.json''
        && openssl rand -out ''$remote_dir/key.bin'' 32 && openssl enc -aes-256-cbc
        -salt -pbkdf2 -in ''$remote_dir/report.json'' -out ''$remote_dir/report.enc''
        -pass file:''$remote_dir/key.bin'' && openssl pkeyutl -encrypt -pubin -inkey
        ''$remote_dir/owner-public.pem'' -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
        -in ''$remote_dir/key.bin'' -out ''$remote_dir/key.enc''"

        mkdir -m 700 -p encrypted-report

        scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST:$remote_dir/report.enc"
        "$VPS_USER@$VPS_HOST:$remote_dir/key.enc" encrypted-report/

        '
    - uses: actions/upload-artifact@v4
      with:
        name: cleaner-upload-diagnosis-encrypted
        path: encrypted-report/
        retention-days: 1
        if-no-files-found: error

