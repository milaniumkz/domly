name: Dispatch checked invoice recovery deployment once
'on':
  push:
    branches:
    - support/deploy-invoice-recovery-20261117
    paths:
    - .github/workflows/dispatch-invoice-recovery-once.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Dispatch standard main deployment with unchanged verified web release
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        repo=milaniumkz/domly

        head=$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)

        test "$head" = f8c76ab794bb62167ef7c5ec9cda180b1fc81a69

        test "$(gh api "repos/$repo/actions/runs/44042037157" --jq .conclusion)" =
        success

        gh api -X POST "repos/$repo/actions/workflows/deploy.yml/dispatches" --input
        - <<''JSON''

        {"ref":"main","inputs":{"mode":"deploy","reuse_web_from_run":"43600267635"}}

        JSON

        '
