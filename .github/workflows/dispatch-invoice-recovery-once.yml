name: Read-only server push configuration audit
'on':
  push:
    branches:
    - support/deploy-invoice-recovery-20261117
    paths:
    - .github/workflows/dispatch-invoice-recovery-once.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
    - name: Validate FCM without sending and encrypt aggregate report
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      run: "set -euo pipefail\numask 077\nmkdir -p ~/.ssh\nprintf '%s' \"${{ secrets.VPS_SSH_PRIVATE_KEY_B64\
        \ }}\" | base64 -d > ~/.ssh/deploy_key\nprintf '%s\\n' \"${{ secrets.VPS_KNOWN_HOSTS\
        \ }}\" > ~/.ssh/known_hosts\ncat > audit.js <<'AUDIT_JS'\nconst {Pool}=require('pg');const\
        \ admin=require('firebase-admin');const {env}=require('./dist/common/env');\n\
        const timeout=(p)=>Promise.race([p,new Promise((_,r)=>{const t=setTimeout(()=>r(Object.assign(new\
        \ Error(),{code:'diagnostic_timeout'})),20000);t.unref();})]);\n(async()=>{const\
        \ db=new Pool({connectionString:process.env.DATABASE_URL});try{\n await db.query('BEGIN\
        \ READ ONLY');await db.query(\"SET LOCAL statement_timeout='10s'\");\n const\
        \ out={at:new Date().toISOString(),config:{projectConfigured:!!env.fcmProjectId,projectMatchesAndroid:env.fcmProjectId==='domly-d0f91',clientEmailConfigured:!!env.fcmClientEmail,privateKeyConfigured:!!env.fcmPrivateKey,privateKeyPemShape:/BEGIN\
        \ PRIVATE KEY/.test(env.fcmPrivateKey)}};\n out.adminRules=(await db.query(\"\
        SELECT COALESCE((value->>'enabled')::boolean,true) enabled,value->'events'\
        \ events FROM app_settings WHERE key='adminNotificationRules'\")).rows;\n\
        \ out.accounts=(await db.query(\"SELECT role,status,deleted_at IS NOT NULL\
        \ deleted,COUNT(*)::int count FROM app_users GROUP BY role,status,deleted_at\
        \ IS NOT NULL\")).rows;\n out.devices=(await db.query(`SELECT u.role,dt.platform,dt.enabled,COUNT(*)::int\
        \ count,MAX(dt.updated_at) last_registered_at\n FROM device_tokens dt JOIN\
        \ app_users u ON u.id=dt.user_id WHERE u.deleted_at IS NULL AND u.status<>'blocked'\n\
        \ GROUP BY u.role,dt.platform,dt.enabled`)).rows;\n out.deliveries=(await\
        \ db.query(`SELECT COALESCE(n.role::text,u.role::text,'unknown') role,COUNT(*)\
        \ FILTER(WHERE d.created_at>NOW()-INTERVAL '24 hours')::int created_24h,\n\
        \ COUNT(*) FILTER(WHERE d.delivered_at>NOW()-INTERVAL '24 hours')::int processed_24h,\n\
        \ COUNT(*) FILTER(WHERE d.delivered_at IS NULL)::int pending,\n MAX(d.attempts)\
        \ max_attempts,MAX(d.delivered_at) last_processed_at,MIN(d.created_at) FILTER(WHERE\
        \ d.delivered_at IS NULL) oldest_pending_at\n FROM notification_deliveries\
        \ d JOIN notifications n ON n.id=d.notification_id LEFT JOIN app_users u ON\
        \ u.id=n.user_id GROUP BY COALESCE(n.role::text,u.role::text,'unknown')`)).rows;\n\
        \ out.queueErrors=(await db.query(\"SELECT last_error,COUNT(*)::int count\
        \ FROM notification_deliveries WHERE delivered_at IS NULL GROUP BY last_error\"\
        )).rows;\n out.adminEvents=(await db.query(\"SELECT role,target_type,COUNT(*)::int\
        \ count FROM notifications WHERE role IN ('admin','superadmin') AND created_at>NOW()-INTERVAL\
        \ '24 hours' GROUP BY role,target_type\")).rows;\n const devices=(await db.query(`SELECT\
        \ dt.token,u.role,dt.platform FROM device_tokens dt JOIN app_users u ON u.id=dt.user_id\n\
        \ WHERE u.role IN ('admin','superadmin') AND dt.enabled AND u.deleted_at IS\
        \ NULL AND u.status<>'blocked'\n ORDER BY dt.updated_at DESC LIMIT 10`)).rows;\n\
        \ out.keyCheck={explicitKey:!!process.env.FCM_PRIVATE_KEY,inlineAccount:!!process.env.FCM_SERVICE_ACCOUNT_JSON,encodedAccount:!!process.env.FCM_SERVICE_ACCOUNT_BASE64,fileAccount:!!process.env.FCM_SERVICE_ACCOUNT_FILE};\n\
        \ try{const crypto=require('node:crypto');const key=crypto.createPrivateKey(env.fcmPrivateKey);out.keyCheck.pemParses=true;out.keyCheck.keyType=key.asymmetricKeyType;\n\
        \ const url='https://www.googleapis.com/robot/v1/metadata/x509/'+encodeURIComponent(env.fcmClientEmail);\n\
        \ const response=await fetch(url,{signal:AbortSignal.timeout(10000)});out.keyCheck.publicCertificatesHttp=response.status;\n\
        \ if(response.ok){const certificates=await response.json();const pub=crypto.createPublicKey(key).export({type:'spki',format:'pem'});out.keyCheck.matchesRegisteredGoogleCertificate=Object.values(certificates).some(cert=>new\
        \ crypto.X509Certificate(cert).publicKey.export({type:'spki',format:'pem'})===pub);}\n\
        \ }catch(e){out.keyCheck.pemParses=out.keyCheck.pemParses??false;out.keyCheck.errorKind=e.code||e.name;}\n\
        \ out.fcm={oauth:false,dryRunOnly:true,checked:0,valid:0,errors:[]};\n if(env.fcmProjectId&&env.fcmClientEmail&&env.fcmPrivateKey){try{\n\
        \  const credential=admin.credential.cert({projectId:env.fcmProjectId,clientEmail:env.fcmClientEmail,privateKey:env.fcmPrivateKey});\n\
        \  out.fcm.oauth=Boolean((await timeout(credential.getAccessToken())).access_token);\n\
        \  const app=admin.initializeApp({credential});\n  for(const d of devices){out.fcm.checked++;try{await\
        \ timeout(app.messaging().send({token:d.token,notification:{title:'Проверка\
        \ настройки',body:'Валидация без доставки'},data:{targetType:'diagnostic'}},true));out.fcm.valid++;}catch(e){out.fcm.errors.push({role:d.role,platform:d.platform,code:e.code||e.name});}}\n\
        \ }catch(e){out.fcm.error=e.code||e.name;\n const message=String(e.message??'').toLowerCase();\n\
        \ const phrases=['certificate','self signed','unable to verify','issuer','econnreset','enotfound','eai_again','econnrefused','etimedout','timeout','fetch\
        \ failed','invalid_client','invalid_scope','invalid_grant','invalid jwt','unauthorized','401','403','404','429','500','502','503','disabled','deleted','access\
        \ denied','permission','error fetching access token','error while making request','unexpected\
        \ response','invalid response','ssl','tls','connection','socket','empty','json','und_err','unsupported','proxy','end\
        \ of','network','error obtaining','stream'];\n out.fcm.errorKeywords=phrases.filter(x=>message.includes(x));\n\
        \ out.fcm.systemErrorCodes=[...new Set((message.match(/\\b(?:enetunreach|ehostunreach|eaddrnotavail|econnreset|econnrefused|etimedout|eai_again|enotfound|eacces|eperm|epipe|eproto)\\\
        b/g)||[]).map(x=>x.toUpperCase()))];\n out.fcm.causeCode=typeof e.cause?.code==='string'&&/^[A-Z_0-9-]{1,80}$/.test(e.cause.code)?e.cause.code:null;\n\
        out.fcm.failureClassification={invalidGrant:message.includes('invalid_grant'),invalidJwtSignature:message.includes('invalid\
        \ jwt signature'),pemParseFailure:message.includes('parse private key')||message.includes('pem'),accountDisabled:message.includes('disabled'),accountNotFound:message.includes('not\
        \ found'),clockError:message.includes('clock')||message.includes('iat')||message.includes('expired'),networkError:message.includes('network')||message.includes('getaddrinfo')||message.includes('timed\
        \ out')};}}\n if(!out.fcm.oauth && env.fcmProjectId&&env.fcmClientEmail&&env.fcmPrivateKey){\n\
        \  try{const agent=new(require('node:https').Agent)({family:4});const credential=admin.credential.cert({clientEmail:env.fcmClientEmail,privateKey:env.fcmPrivateKey,projectId:env.fcmProjectId},agent);out.fcm.ipv4OAuth=Boolean((await\
        \ timeout(credential.getAccessToken())).access_token);}catch(e){out.fcm.ipv4OAuth=false;out.fcm.ipv4Error=e.code||e.name;const\
        \ m=String(e.message??'').toLowerCase();out.fcm.ipv4SystemCodes=[...new Set((m.match(/\\\
        b(?:enetunreach|ehostunreach|eaddrnotavail|econnreset|econnrefused|etimedout|eai_again|enotfound|eacces|eperm|epipe|eproto)\\\
        b/g)||[]).map(x=>x.toUpperCase()))];}\n }\n out.fcm.originalDnsOrder=require('node:dns').getDefaultResultOrder();\n\
        \ if(!out.fcm.oauth && out.fcm.ipv4OAuth){\n  require('node:dns').setDefaultResultOrder('ipv4first');\n\
        \  try{const credential=admin.credential.cert({projectId:env.fcmProjectId,clientEmail:env.fcmClientEmail,privateKey:env.fcmPrivateKey});out.fcm.dnsIpv4OAuth=Boolean((await\
        \ timeout(credential.getAccessToken())).access_token);\n   const app=admin.initializeApp({credential},'diagnostic-ipv4');out.fcm.ipv4Validation={checked:0,valid:0,errors:[]};\n\
        \   for(const d of devices){out.fcm.ipv4Validation.checked++;try{await timeout(app.messaging().send({token:d.token,notification:{title:'Проверка\
        \ настройки',body:'Валидация без доставки'},data:{targetType:'diagnostic'}},true));out.fcm.ipv4Validation.valid++;}catch(e){out.fcm.ipv4Validation.errors.push({role:d.role,platform:d.platform,code:e.code||e.name});}}\n\
        \  }catch(e){out.fcm.dnsIpv4Error=e.code||e.name;}\n }\n await db.query('ROLLBACK');console.log(JSON.stringify(out));\n\
        \ }finally{await db.end();}})().catch(e=>{console.error(e.code||e.name);process.exitCode=1;});\n\
        AUDIT_JS\ncat > owner-public.pem <<'OWNER_KEY'\n-----BEGIN PUBLIC KEY-----\n\
        MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAumiD9Ft9K1xVRPwyJYeJ\nxV1fAy/0/72HiZx6x4Y/Qi1I2WDOlu04hOWVuNQ4AVClt/KAdfJ86RP7oXEJvB8U\n\
        VrOgXcQhT/Yg/5/GxhD2NSWAUz/9lw2AGeSI2GpQOtft/xnmaH8yH3MxiwFlrAiA\neMicXn38Yd5OHMXGB5lU+/0i6MG2VFeu1SBQ2Xs5DrXZXQXGwBISiHu6KgakWq/T\n\
        WSKT9G8ai3owA5EPrFCb2NNZezjTVJMOYUoi9uvZI8cO8IKRN8RsGxPCIPVisfrb\n3TC8AmT/na6UmxgQuMPmsD3p+Am8uG7Z6NqSBukNlI2FonRWWaYfLp/pJcnsBAEY\n\
        YhrdCsqzHCDalkEiceInvlKn71bvn1X6XetHrUFXQnNEkt/aGs/B5O6GLael3m6H\nH8zY5vm1DEo/tudo367+y/RTX9I3fNqaV/5CDyjxKHhfbe6GFKy8nCoPsuhFJiLS\n\
        rB8dXGd4Ix0oMapjeNgys2VUE451mz/8R5LIiHNgAXxlAgMBAAE=\n-----END PUBLIC KEY-----\n\
        OWNER_KEY\ncat > host-audit.py <<'HOST_AUDIT'\nimport json,subprocess,sys\n\
        from pathlib import Path\np=Path(sys.argv[1]);r=json.loads((p/'report.json').read_text())\n\
        r['containers']={}\nfor service in ['api','worker']:\n q=subprocess.run(['docker','compose','-p','domly-backend','ps','-q',service],capture_output=True,text=True,timeout=10)\n\
        \ cid=q.stdout.strip()\n if not cid:r['containers'][service]={'found':False};continue\n\
        \ q=subprocess.run(['docker','inspect','--format','{{json .State}}',cid],capture_output=True,text=True,timeout=10)\n\
        \ state=json.loads(q.stdout);r['containers'][service]={k:state.get(k) for\
        \ k in ['Status','Running','OOMKilled','Restarting','StartedAt']}\n q=subprocess.run(['docker','logs','--since','60m',cid],capture_output=True,text=True,timeout=15)\n\
        \ logs=q.stdout+q.stderr\n r['containers'][service]['logCounts']={x:logs.count(x)\
        \ for x in ['PushDeliveryFailed','[fcm] push failed','[notifications] Outbox\
        \ processing failed','ENOTFOUND','EAI_AGAIN','ECONNREFUSED']}\n(p/'report.json').write_text(json.dumps(r))\n\
        HOST_AUDIT\nremote_dir=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"\
        $VPS_USER@$VPS_HOST\" 'mktemp -d /tmp/domly-push-audit-XXXXXX')\n[[ \"$remote_dir\"\
        \ =~ ^/tmp/domly-push-audit-[A-Za-z0-9]+$ ]]\ntrap 'ssh -i ~/.ssh/deploy_key\
        \ -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\" \"rm -rf -- $remote_dir\"\
        \ >/dev/null 2>&1 || true' EXIT\nscp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes\
        \ audit.js owner-public.pem host-audit.py \"$VPS_USER@$VPS_HOST:$remote_dir/\"\
        \nssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \"$VPS_USER@$VPS_HOST\" \"\
        set -euo pipefail; cd '$DEPLOY_PATH/current' && umask 077 && timeout 240 docker\
        \ compose -p domly-backend exec -T api node - < '$remote_dir/audit.js' > '$remote_dir/report.json'\
        \ && python3 '$remote_dir/host-audit.py' '$remote_dir' && openssl rand -out\
        \ '$remote_dir/key.bin' 32 && openssl enc -aes-256-cbc -salt -pbkdf2 -in '$remote_dir/report.json'\
        \ -out '$remote_dir/report.enc' -pass file:'$remote_dir/key.bin' && openssl\
        \ pkeyutl -encrypt -pubin -inkey '$remote_dir/owner-public.pem' -pkeyopt rsa_padding_mode:oaep\
        \ -pkeyopt rsa_oaep_md:sha256 -in '$remote_dir/key.bin' -out '$remote_dir/key.enc'\"\
        \nmkdir -m 700 -p encrypted-report\nscp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes\
        \ \"$VPS_USER@$VPS_HOST:$remote_dir/report.enc\" \"$VPS_USER@$VPS_HOST:$remote_dir/key.enc\"\
        \ encrypted-report/\n"
    - uses: actions/upload-artifact@v4
      with:
        name: admin-push-audit-encrypted
        path: encrypted-report/
        retention-days: 1
        if-no-files-found: error
