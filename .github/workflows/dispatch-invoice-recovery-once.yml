name: Verify deployed 21:00 booking policy without customer data
'on':
  push:
    branches:
    - support/deploy-invoice-recovery-20261117
    paths:
    - .github/workflows/dispatch-invoice-recovery-once.yml
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
    - name: Require successful checked main deployment
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        python3 - <<''PYCODE''

        import json,subprocess

        def api(path):return json.loads(subprocess.check_output([''gh'',''api'',''repos/milaniumkz/domly/''+path]))

        assert api(''git/ref/heads/main'')[''object''][''sha'']==''247451056aad92a61aa5d284afdb262866d41994''

        r=api(''actions/runs/45025708205'')

        assert r[''head_sha'']==''247451056aad92a61aa5d284afdb262866d41994'' and r[''conclusion'']==''success''
        and r[''path'']==''.github/workflows/deploy.yml''

        PYCODE

        '
    - name: Assert deployed booking rules using synthetic dates only
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      run: 'set -euo pipefail

        umask 077

        mkdir -p ~/.ssh

        printf ''%s'' "${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key

        printf ''%s\n'' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

        cat > verify.js <<''VERIFY_JS''

        const assert=require(''node:assert/strict'');

        assert.equal(process.env.APP_RELEASE,''247451056aad92a61aa5d284afdb262866d41994'');

        const {isBookableStart,validateBookingStart,fitsBookingHours}=require(''./dist/modules/bookingValidation'');

        const before=Date.parse(''2026-11-22T20:59:59+05:00''),after=Date.parse(''2026-11-22T21:00:00+05:00'');

        assert.equal(isBookableStart(''2026-11-23'',''08:00'',before),true);

        assert.equal(isBookableStart(''2026-11-23'',''08:00'',after),false);

        assert.equal(isBookableStart(''2026-11-23'',''12:00'',after),true);

        assert.equal(isBookableStart(''2026-11-24'',''08:00'',after),true);

        assert.throws(()=>validateBookingStart(''2026-11-23'',''08:00'',after),e=>e.code===''next_morning_booking_closed'');

        assert.doesNotThrow(()=>validateBookingStart(''2026-11-23'',''12:00'',after));

        assert.equal(fitsBookingHours(''18:00'',600),true);assert.equal(fitsBookingHours(''18:05'',180),false);

        console.log(JSON.stringify({releaseMatches:true,cutoff21Verified:true,nextDayMorningBlocked:true,nextDayNoonAllowed:true,laterDaysUnaffected:true,lastStart18Preserved:true,customerDataRead:false,customerDataChanged:false}));

        VERIFY_JS

        ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "test
        \"\$(cat ''$DEPLOY_PATH/REVISION'')\" = 247451056aad92a61aa5d284afdb262866d41994 && cd ''$DEPLOY_PATH/current''
        && docker compose -p domly-backend exec -T api node -" < verify.js

        '
concurrency:
  group: production-deploy
  cancel-in-progress: false

