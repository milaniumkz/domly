server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  location /.well-known/ {
    proxy_pass http://api:8080/.well-known/;
    proxy_set_header Host $host;
  }
  location = /firebase-messaging-sw.js { alias /srv/domly-web/current/customer/firebase-messaging-sw.js; }
  location = /app-links { proxy_pass http://api:8080/app-links; }
  location = / { return 302 /customer/; }
  location = /customer { return 302 /customer/; }
  location = /pro { return 302 /pro/; }
  location /customer/ {
    root /srv/domly-web/current;
    try_files $uri $uri/ /customer/index.html;
  }
  location /pro/ {
    root /srv/domly-web/current;
    try_files $uri $uri/ /pro/index.html;
  }
  location /admin/ {
    root /srv/domly-web/current;
    try_files $uri $uri/ /admin/index.html;
  }

  location = /health {
    proxy_pass http://api:8080/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /ready {
    proxy_pass http://api:8080/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/realtime {
    proxy_pass http://api:8080/api/v1/realtime;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /files/ {
    proxy_pass http://minio:9000/domly/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
